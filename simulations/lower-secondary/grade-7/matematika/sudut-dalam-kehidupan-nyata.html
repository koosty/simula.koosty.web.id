    :root {
      /* Colour */
      --bg: #12131d;          /* page background; also the 3D canvas background */
      --surface: #1a1b25;     /* panels, cards, step rows */
      --panel: #1e1f2a;
      --border: #3b494b;
      --border-strong: #849495;
      --text: #e2e1f0;
      --text-muted: #b9cacb;
      --text-dim: #849495;
      --accent: #00f0ff;      /* primary action, slider thumb, active state */
      --accent-hover: #7df4ff;
      --accent-soft: rgba(138, 43, 226, 0.95);  /* tooltips, transient overlays */
      --accent-text: #0b0c16;
      --success: #39ff14;     /* completion, headings, callouts */
      --warning: #ffe600;
      --error: #ff4a8d;

      /* Spacing scale */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      /* Radius scale */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-pill: 999px;

      /* Type scale (system fonts only) */
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --text-base: 16px;
      --text-sm: 14px;
      --text-xs: 13px;
      --text-caption: 11px;   /* uppercase control labels */
      --text-heading: 24px;

      /* Focus, motion, stacking */
      --focus-ring: 0 0 0 3px rgba(0, 240, 255, 0.5);
      --motion: 0.2s;
      --motion-slow: 0.3s;
      --z-overlay: 100;        /* panels, tooltips */
      --z-modal: 1000;         /* loading screens, modal dialogs */
    }

    h1, h2, h3 { font-family: var(--font-display); }


    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      font-size: var(--text-base);
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
    }

    .panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

    .btn {
      font-family: inherit;
      font-size: var(--text-sm);
      min-height: 44px;
      min-width: 44px;
      padding: var(--space-3) var(--space-5);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--border-strong);
      color: var(--bg);
      cursor: pointer;
      transition: background var(--motion);
    }
    .btn:hover { background: var(--text-muted); }
    .btn:active { transform: scale(0.95); }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface); }

    .control-label {
      font-size: var(--text-caption);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%; height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border-strong);
      border-radius: var(--radius-pill);
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    #feedback-panel {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
    }
    #feedback-panel.success { border-left-color: var(--success); }
    #feedback-panel.error { border-left-color: var(--error); }

    .progress-track {
      height: 8px;
      background: var(--border-strong);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--accent); transition: width var(--motion-slow); }

    /* ---- layout ---- */
    .wrap { max-width: 980px; margin: 0 auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
    h1 { font-size: var(--text-heading); }
    h2 { font-size: var(--text-base); }
    .sub { color: var(--text-muted); font-size: var(--text-sm); }
    .mono { font-family: var(--font-mono); }
    .topbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .spacer { flex: 1; }

    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    .hud-cell {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg);
      padding: var(--space-2) var(--space-3);
    }
    .hud-cell .nilai { font-family: var(--font-mono); font-size: var(--text-base); color: var(--success); }

    #scene-box { padding: var(--space-2); }
    #scene { display: block; width: 100%; height: auto; touch-action: none; }

    .jalan { stroke: var(--border-strong); stroke-width: 30; fill: none; }
    .tengah { stroke: var(--text-dim); stroke-width: 2; stroke-dasharray: 12 12; fill: none; }
    .permukaan { stroke: var(--text-muted); stroke-width: 4; fill: none; }
    .bantu { stroke: var(--text-dim); stroke-width: 2; stroke-dasharray: 6 8; fill: none; }
    .siku { stroke: var(--text-dim); stroke-width: 2; fill: none; }
    .dinding { stroke: var(--text-muted); stroke-width: 4; fill: none; }
    .tangga { stroke: var(--text-muted); stroke-width: 3; fill: none; }
    .atap-isi { fill: var(--accent); opacity: 0.22; stroke: none; }
    .pintu { fill: var(--border-strong); stroke: var(--text-muted); stroke-width: 2; }
    .known-wedge { fill: var(--accent-soft); opacity: 0.18; stroke: none; }
    .known-arc { fill: none; stroke: var(--warning); stroke-width: 3; }
    .unknown-wedge { fill: var(--accent); opacity: 0.3; stroke: none; }
    .unknown-arc { fill: none; stroke: var(--accent); stroke-width: 4; }
    .unknown-wedge.terisi { fill: var(--success); opacity: 0.45; }
    .unknown-arc.terisi { stroke: var(--success); }
    .titik { fill: var(--text); }
    .lbl { fill: var(--text); font-family: var(--font-mono); font-size: 16px; text-anchor: middle; }
    .lbl-sm { fill: var(--text-muted); font-family: var(--font); font-size: 13px; text-anchor: middle; }
    .kenop { fill: var(--success); stroke: var(--bg); stroke-width: 2; }
    .kenop-sentuh { fill: transparent; cursor: grab; pointer-events: all; }

    .opsi { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .opsi .btn { font-family: var(--font-mono); }

    .baris-jawab { display: flex; gap: var(--space-3); align-items: flex-end; flex-wrap: wrap; margin-top: var(--space-3); }
    .kolom-isian { display: flex; flex-direction: column; gap: var(--space-2); }
    #answer-input {
      font-family: var(--font-mono);
      font-size: var(--text-base);
      min-height: 44px;
      width: 130px;
      padding: var(--space-2) var(--space-3);
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
    }
    #answer-input:focus-visible { outline: none; box-shadow: var(--focus-ring); border-color: var(--accent); }

    .slider-row { display: flex; flex-direction: column; gap: var(--space-2); }
    .slider-row input[type="range"] { height: 44px; background: transparent; }
    .slider-row input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; background: var(--border-strong); border-radius: var(--radius-pill);
    }
    .slider-row input[type="range"]::-webkit-slider-thumb { margin-top: -7px; }
    .slider-row input[type="range"]::-moz-range-track {
      height: 6px; background: var(--border-strong); border-radius: var(--radius-pill);
    }
    .slider-row input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border: 0; background: var(--accent); border-radius: 50%;
    }

    .lencana { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .lencana-item {
      font-size: var(--text-xs);
      color: var(--text-dim);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-pill);
      padding: var(--space-1) var(--space-3);
    }
    .lencana-item.terbuka {
      color: var(--text);
      border-style: solid;
      border-color: var(--success);
      background: var(--bg);
    }

    .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }

    @media (max-width: 600px) {
      .hud { grid-template-columns: 1fr 1fr; }
      .opsi .btn, .actions .btn, .baris-jawab .btn { flex: 1 1 100%; }
    }
  </style>

  <script>
  (function () {
    'use strict';

    var RAD = Math.PI / 180;
    var TOLERANSI = 1;
    var R_BUSUR = 74;

    /* ------------------------------------------------------------------
       Delapan tantangan. Setiap level memberi beberapa sudut yang sudah
       diketahui (digambar penuh) dan satu sudut yang dicari (busur ungu). */

    /* Sudut atap dan tangga ikut dihitung agar busur selalu cocok dengan
       gambar. Sumbu x ke kanan, sumbu y ke bawah; sudut diukur dari arah
       kanan dan berputar berlawanan arah jarum jam. */
    var ATAP = { atapX: 320, kakiY: 280, lebarDasar: 200 };
    var TANGGA = { lantaiY: 330, kakiX: 200, panjang: 260 };

    function isiSudutAtap(lv) {
      /* Alas atap tetap selebar ATAP.lebarDasar. Tinggi dan letak puncak
         dihitung dari dua sudut alas, supaya gambar sesuai besar sudutnya. */
      var tanKiri = Math.tan(lv.sudutKiri * RAD);
      var tanKanan = Math.tan(lv.sudutKanan * RAD);
      var tinggi = ATAP.lebarDasar / (1 / tanKiri + 1 / tanKanan);
      var kiri = ATAP.atapX - ATAP.lebarDasar / 2;
      var kanan = ATAP.atapX + ATAP.lebarDasar / 2;
      var atap = { x: kiri + tinggi / tanKiri, y: ATAP.kakiY - tinggi };
      lv.atap = atap;
      lv.known = [
        { x: kiri, y: ATAP.kakiY, a0: 0, a1: lv.sudutKiri, label: lv.sudutKiri + '\u00B0', r: 66 },
        { x: kanan, y: ATAP.kakiY, a0: 180 - lv.sudutKanan, a1: 180, label: lv.sudutKanan + '\u00B0', r: 66 }
      ];
      /* Sudut puncak diukur dari sisi kiri atap (180 + sudut kiri)
         sampai sisi kanan (360 - sudut kanan). */
      lv.unknown = {
        x: atap.x, y: atap.y, a0: 180 + lv.sudutKiri, arah: 1,
        benar: 180 - lv.sudutKiri - lv.sudutKanan, r: 62
      };
      lv.kaki = { kiri: kiri, kanan: kanan };
      return lv;
    }

    function isiSudutTangga(lv, diketahuiDinding) {
      /* Panjang mendatar tetap, tinggi mengikuti sudut, jadi gambar
         selalu benar untuk setiap sudut. */
      var tinggi = TANGGA.panjang * Math.tan(lv.sudutLantai * RAD);
      var atas = { x: TANGGA.kakiX + TANGGA.panjang, y: TANGGA.lantaiY - tinggi };
      lv.atas = atas;
      if (diketahuiDinding) {
        lv.known = [{
          x: atas.x, y: atas.y, a0: 180 + lv.sudutLantai, a1: 270,
          label: (90 - lv.sudutLantai) + '\u00B0', r: 74
        }];
        lv.unknown = { x: TANGGA.kakiX, y: TANGGA.lantaiY, a0: 0, arah: 1, benar: lv.sudutLantai, r: 74 };
      } else {
        lv.known = [{
          x: TANGGA.kakiX, y: TANGGA.lantaiY, a0: 0, a1: lv.sudutLantai,
          label: lv.sudutLantai + '\u00B0', r: 74
        }];
        lv.unknown = { x: atas.x, y: atas.y, a0: 180 + lv.sudutLantai, arah: 1, benar: 90 - lv.sudutLantai, r: 74 };
      }
      return lv;
    }

    var LEVELS = [

    /* Urutan permainan naik perlahan: mulai dari satu sudut siku yang
       terpecah menjadi dua bagian, ditutup dengan tiga sudut sekaligus. */
    LEVELS = [
      LEVELS[0], LEVELS[2], LEVELS[1], LEVELS[4],
      LEVELS[3], LEVELS[5], LEVELS[6], LEVELS[7]
    ];

    var BADGE = [
      { id: 'ahli_persimpangan', nama: 'Ahli Persimpangan' },
      { id: 'tanpa_salah', nama: 'Tanpa Salah' },

    /* ------------------------------------------------------------------
       Gambar adegan (SVG)
    ------------------------------------------------------------------ */
    function P(v, r, a) {
      var t = a * RAD;
      return (v.x + r * Math.cos(t)).toFixed(2) + ',' + (v.y - r * Math.sin(t)).toFixed(2);
    }

    function busurD(v, r, a0, a1) {
      var besar = Math.abs(a1 - a0) > 180 ? 1 : 0;
      var arah = a1 > a0 ? 0 : 1;
      return 'M ' + P(v, r, a0) + ' A ' + r + ' ' + r + ' 0 ' + besar + ' ' + arah + ' ' + P(v, r, a1);
    }

    function bajurD(v, r, a0, a1) {
      return 'M ' + v.x + ',' + v.y + ' L ' + P(v, r, a0) +
        ' A ' + r + ' ' + r + ' 0 ' + (Math.abs(a1 - a0) > 180 ? 1 : 0) + ' ' +
        (a1 > a0 ? 0 : 1) + ' ' + P(v, r, a1) + ' Z';
    }

    function jalanDariSudut(v, a, panjang) {
      var t = a * RAD;
      var x2 = (v.x + panjang * Math.cos(t)).toFixed(1);
      var y2 = (v.y - panjang * Math.sin(t)).toFixed(1);
      return '<line class="jalan" x1="' + v.x + '" y1="' + v.y + '" x2="' + x2 + '" y2="' + y2 + '"/>' +
        '<line class="tengah" x1="' + v.x + '" y1="' + v.y + '" x2="' + x2 + '" y2="' + y2 + '"/>';
    }


    function adeganPersimpangan(lv) {
      var v = { x: 320, y: 300 };
      var s = '';
      s += '<line class="jalan" x1="60" y1="300" x2="600" y2="300"/>';
      s += '<line class="tengah" x1="60" y1="300" x2="600" y2="300"/>';
      s += jalanDariSudut(v, lv.id === 'persimpangan-90' ? 40 : 120, 250);
      if (lv.id === 'persimpangan-90') {
        s += '<line class="jalan" x1="320" y1="66" x2="320" y2="300"/>';
        s += '<line class="tengah" x1="320" y1="66" x2="320" y2="300"/>';
        s += '<text class="lbl-sm" x="336" y="88">jalan tegak lurus</text>';
      }
      s += '<text class="lbl-sm" x="90" y="340">jalan desa</text>';
      return s;
    }

    function adeganKemiringan(lv) {
      var v = { x: 150, y: 320 };
      var s = '';
      s += '<line class="permukaan" x1="70" y1="320" x2="600" y2="320"/>';
      for (var x = 90; x < 600; x += 60) {
        s += '<line class="tengah" x1="' + x + '" y1="328" x2="' + (x + 30) + '" y2="328"/>';
      }
      s += '<line class="bantu" x1="150" y1="320" x2="150" y2="128"/>';
      s += '<path class="siku" d="M 150,300 L 170,300 L 170,320"/>';
      s += jalanDariSudut(v, 15, 430);
      s += '<text class="lbl-sm" x="300" y="372">jalan menuju pasar</text>';
      return s;
    }

    function adeganAtap(lv) {
      var atap = lv.atap;
      var kaki = lv.kaki;
      var dasar = ATAP.kakiY;
      var tanah = 350;
      var s = '';
      s += '<polygon class="atap-isi" points="' + kaki.kiri.toFixed(1) + ',' + dasar + ' ' +
        atap.x + ',' + atap.y + ' ' + kaki.kanan.toFixed(1) + ',' + dasar + '"/>';
      s += '<line class="dinding" x1="' + kaki.kiri.toFixed(1) + '" y1="' + dasar + '" x2="' + kaki.kiri.toFixed(1) + '" y2="' + tanah + '"/>';
      s += '<line class="dinding" x1="' + kaki.kanan.toFixed(1) + '" y1="' + dasar + '" x2="' + kaki.kanan.toFixed(1) + '" y2="' + tanah + '"/>';
      s += '<line class="permukaan" x1="' + kaki.kiri.toFixed(1) + '" y1="' + dasar + '" x2="' + atap.x.toFixed(1) + '" y2="' + atap.y.toFixed(1) + '"/>';
      s += '<line class="permukaan" x1="' + atap.x.toFixed(1) + '" y1="' + atap.y.toFixed(1) + '" x2="' + kaki.kanan.toFixed(1) + '" y2="' + dasar + '"/>';
      s += '<line class="tengah" x1="' + kaki.kiri.toFixed(1) + '" y1="' + dasar + '" x2="' + kaki.kanan.toFixed(1) + '" y2="' + dasar + '"/>';
      s += '<line class="permukaan" x1="' + (kaki.kiri - 40).toFixed(1) + '" y1="' + tanah + '" x2="' + (kaki.kanan + 40).toFixed(1) + '" y2="' + tanah + '"/>';
      s += '<rect class="pintu" x="' + ((kaki.kiri + kaki.kanan) / 2 - 16).toFixed(1) + '" y="' + (tanah - 46) + '" width="32" height="46" rx="4"/>';
      s += '<text class="lbl-sm" x="320" y="' + (tanah + 24) + '">rumah di desa</text>';
      return s;
    }

    function adeganTangga(lv) {
      var atas = lv.atas;
      var jumlah = 7;
      var lebar = (atas.x - TANGGA.kakiX) / jumlah;
      var tinggi = (TANGGA.lantaiY - atas.y) / jumlah;
      var s = '';
      s += '<line class="permukaan" x1="' + (TANGGA.kakiX - 40) + '" y1="' + TANGGA.lantaiY + '" x2="' + (atas.x + 120) + '" y2="' + TANGGA.lantaiY + '"/>';
      s += '<line class="dinding" x1="' + atas.x.toFixed(1) + '" y1="' + (atas.y - 60) + '" x2="' + atas.x.toFixed(1) + '" y2="' + TANGGA.lantaiY + '"/>';
      var pts = [[TANGGA.kakiX, TANGGA.lantaiY]];
      for (var i = 1; i <= jumlah; i++) {
        var x = TANGGA.kakiX + lebar * i;
        var y = TANGGA.lantaiY - tinggi * i;
        pts.push([x, y]);
        pts.push([x + lebar, y]);
      }
      var d = 'M ' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
      for (var j = 1; j < pts.length; j++) {
        d += ' L ' + pts[j][0].toFixed(1) + ',' + pts[j][1].toFixed(1);
      }
      s += '<path class="tangga" d="' + d + '"/>';
      s += '<line class="permukaan" x1="' + TANGGA.kakiX + '" y1="' + TANGGA.lantaiY + '" x2="' + atas.x.toFixed(1) + '" y2="' + atas.y.toFixed(1) + '"/>';
      s += '<text class="lbl-sm" x="' + (TANGGA.kakiX - 10) + '" y="' + (TANGGA.lantaiY + 24) + '">lantai</text>';
      s += '<text class="lbl-sm" x="' + (atas.x + 18) + '" y="' + (atas.y - 30) + '">dinding</text>';
      return s;
    }

    function adeganSimpangTiga(lv) {
      var v = { x: 320, y: 320 };
      var s = '';
      s += '<line class="jalan" x1="70" y1="320" x2="600" y2="320"/>';
      s += '<line class="tengah" x1="70" y1="320" x2="600" y2="320"/>';
      s += jalanDariSudut(v, 40, 250);
      s += jalanDariSudut(v, 95, 250);
      s += '<text class="lbl-sm" x="520" y="356">jalan utama</text>';
      return s;
    }

    var ADEGAN = {
      persimpangan: adeganPersimpangan,
      kemiringan: adeganKemiringan,
      atap: adeganAtap,
      tangga: adeganTangga,
      'simpang-tiga': adeganSimpangTiga
    };

    /* ------------------------------------------------------------------
       Keadaan permainan
    ------------------------------------------------------------------ */
    var state = {
      index: 0,
      skor: 0,
      benar: 0,
      salah: 0,
      selesai: false,
      terkunci: false,
      kandidat: 20,
      tampil: 20,
      lencana: {}
    };

    var svg = document.getElementById('scene');
    var gLatar = document.getElementById('g-latar');
    var gKnown = document.getElementById('g-known');
    var gUnknown = document.getElementById('g-unknown');
    var sceneTitle = document.getElementById('scene-title');
    var questionTitle = document.getElementById('question-title');
    var questionText = document.getElementById('question-text');
    var questionHint = document.getElementById('question-hint');
    var optionRow = document.getElementById('option-row');
    var answerInput = document.getElementById('answer-input');
    var checkBtn = document.getElementById('check-btn');
    var nextBtn = document.getElementById('next-btn');
    var resetBtn = document.getElementById('reset-btn');
    var feedback = document.getElementById('feedback-panel');
    var levelDisplay = document.getElementById('level-display');
    var scoreDisplay = document.getElementById('score-display');
    var progressDisplay = document.getElementById('progress-display');
    var progressFill = document.getElementById('progress-fill');
    var slider = document.getElementById('sudut-slider');
    var badgeRow = document.getElementById('badge-row');

    var els = {};

    /* ------------------------------------------------------------------
       Menggambar level
    ------------------------------------------------------------------ */
    function levelSekarang() { return LEVELS[state.index]; }

    function gambarSudutDiketahui(lv) {
      var s = '';
      lv.known.forEach(function (k) {
        var r = k.r || R_BUSUR;
        s += '<path class="known-wedge" d="' + bajurD(k, r, k.a0, k.a1) + '"/>';
        s += '<path class="known-arc" d="' + busurD(k, r, k.a0, k.a1) + '"/>';
        var tengah = (k.a0 + k.a1) / 2;
        var t = tengah * RAD;
        s += '<text class="lbl" x="' + (k.x + (r + 28) * Math.cos(t)).toFixed(1) +
          '" y="' + (k.y - (r + 28) * Math.sin(t) + 6).toFixed(1) + '">' + k.label + '</text>';
        s += '<circle class="titik" cx="' + k.x + '" cy="' + k.y + '" r="5"/>';
      });
      return s;
    }

    function gambarLevel() {
      var lv = levelSekarang();
      gLatar.innerHTML = ADEGAN[lv.adegan](lv);
      gKnown.innerHTML = gambarSudutDiketahui(lv);
      gUnknown.innerHTML =
        '<path id="wedge" class="unknown-wedge" d=""/>' +
        '<path id="arc" class="unknown-arc" d=""/>' +
        '<text id="unlabel" class="lbl" x="0" y="0">?</text>' +
        '<circle id="knob-hit" class="kenop-sentuh" r="30"/>' +
        '<circle id="knob" class="kenop" r="12"/>';
      els.wedge = document.getElementById('wedge');
      els.arc = document.getElementById('arc');
      els.unlabel = document.getElementById('unlabel');
      els.knob = document.getElementById('knob');
      els.knobHit = document.getElementById('knob-hit');

      els.knobHit.addEventListener('pointerdown', mulaiSeretBusur);

      gambarBusur();
    }

    function gambarBusur() {
      if (!els.arc) return;
      var u = levelSekarang().unknown;
      var r = u.r || R_BUSUR;
      var a1 = u.a0 + u.arah * state.tampil;
      els.wedge.setAttribute('d', bajurD(u, r, u.a0, a1));
      els.arc.setAttribute('d', busurD(u, r, u.a0, a1));
      var t = a1 * RAD;
      els.knob.setAttribute('cx', (u.x + r * Math.cos(t)).toFixed(2));
      els.knob.setAttribute('cy', (u.y - r * Math.sin(t)).toFixed(2));
      els.knobHit.setAttribute('cx', els.knob.getAttribute('cx'));
      els.knobHit.setAttribute('cy', els.knob.getAttribute('cy'));
      var tm = ((u.a0 + a1) / 2) * RAD;
      els.unlabel.setAttribute('x', (u.x + (r + 34) * Math.cos(tm)).toFixed(1));
      els.unlabel.setAttribute('y', (u.y - (r + 34) * Math.sin(tm) + 6).toFixed(1));
    }


    /* ------------------------------------------------------------------
       Animasi busur yang terisi
    ------------------------------------------------------------------ */
    var jalanAnimasi = false;
    function animasi() {
      if (Math.abs(state.tampil - state.kandidat) < 0.05) {
        state.tampil = state.kandidat;
        jalanAnimasi = false;
        gambarBusur();
        return;
      }
      state.tampil += (state.kandidat - state.tampil) * 0.25;
      gambarBusur();
      requestAnimationFrame(animasi);
    }
    function mulaiAnimasi() {
      if (!jalanAnimasi) { jalanAnimasi = true; requestAnimationFrame(animasi); }
    }

    /* ------------------------------------------------------------------
       Menyeret busur sudut
    ------------------------------------------------------------------ */
    var menyeret = false;
    function titikKeSvg(event) {
      var pt = svg.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      var m = svg.getScreenCTM();
      if (!m) return null;
      return pt.matrixTransform(m.inverse());
    }

    function mulaiSeretBusur(event) {
      if (state.terkunci || state.selesai) return;
      menyeret = true;
      event.preventDefault();
      geserBusur(event);
    }

    function geserBusur(event) {
      if (!menyeret) return;
      event.preventDefault();
      var p = titikKeSvg(event);
      if (!p) return;
      var u = levelSekarang().unknown;
      var a = Math.atan2(u.y - p.y, p.x - u.x) / RAD;
      var d = ((a - u.a0) % 360 + 360) % 360;
      if (u.arah < 0) d = 360 - d;
      setSudutDicoba(d);
    }

    function selesaiSeretBusur() { menyeret = false; }

    function setSudutDicoba(nilai) {
      state.kandidat = Math.max(5, Math.min(175, Math.round(nilai)));
      if (document.activeElement !== slider) slider.value = state.kandidat;
      mulaiAnimasi();
    }

    /* ------------------------------------------------------------------
       Panel jawaban
    ------------------------------------------------------------------ */
    function muatLevel() {
      var lv = levelSekarang();
      state.selesai = false;
      state.terkunci = false;
      state.kandidat = 20;
      state.tampil = 20;
      slider.value = 20;
      answerInput.value = '';
      answerInput.disabled = false;
      slider.disabled = false;

      sceneTitle.textContent = lv.nama;
      questionTitle.textContent = 'Tantangan ' + (state.index + 1);
      questionText.innerHTML = lv.teks;
      questionHint.innerHTML = 'Petunjuk: ' + lv.petunjuk;

      optionRow.innerHTML = '';
      if (lv.opsi) {
        lv.opsi.forEach(function (nilai) {
          var b = document.createElement('button');
          b.className = 'btn';
          b.type = 'button';
          b.textContent = nilai + '\u00B0';
          b.setAttribute('data-nilai', nilai);
          b.addEventListener('click', function () {
            if (state.terkunci || state.selesai) return;
            answerInput.value = nilai;
            setSudutDicoba(nilai);
            periksa(nilai);
          });
          optionRow.appendChild(b);
        });
      } else {
        var p = document.createElement('p');
        p.className = 'sub';
        p.textContent = 'Level ini tanpa pilihan jawaban. Hitung sendiri, lalu isi kolom di bawah.';
        optionRow.appendChild(p);
      }

      feedback.className = '';
      feedback.textContent = 'Busur ungu adalah sudut yang dicari. Geser bulatannya, isi jawabannya, lalu tekan Periksa Jawaban.';
      checkBtn.disabled = false;
      nextBtn.disabled = true;

      gambarLevel();
      els.wedge.classList.remove('terisi');
      els.arc.classList.remove('terisi');
      perbaruiHUD();
    }

    function periksa(nilai) {
      var lv = levelSekarang();
      if (state.terkunci || state.selesai) return;
      var n = typeof nilai === 'number' ? nilai : parseFloat(answerInput.value);
      if (isNaN(n)) {
        feedback.className = 'error';
        feedback.textContent = 'Isi dulu besar sudutnya dengan angka derajat, lalu tekan Periksa Jawaban.';
        return;
      }
      if (n < 0 || n > 180) {
        feedback.className = 'error';
        feedback.textContent = 'Besar sudut harus antara 0\u00B0 dan 180\u00B0.';
        return;
      }
      setSudutDicoba(n);
      if (Math.abs(n - lv.unknown.benar) <= TOLERANSI) {
        state.terkunci = true;
        state.selesai = true;
        state.benar += 1;
        lv.terlewati = true;
        state.skor += 100 + state.index * 20;
        setSudutDicoba(lv.unknown.benar);
        feedback.className = 'success';
        feedback.innerHTML = lv.jelaskan;
        els.wedge.classList.add('terisi');
        els.arc.classList.add('terisi');
        els.unlabel.textContent = lv.unknown.benar + '\u00B0';
        checkBtn.disabled = true;
        answerInput.disabled = true;
        slider.disabled = true;
        if (state.index === LEVELS.length - 1) {
          nextBtn.disabled = false;
          nextBtn.textContent = 'Ulangi dari Tantangan 1';
        } else {
          nextBtn.disabled = false;
          nextBtn.textContent = 'Tantangan Berikutnya';
        }
        bukaLencana();
        perbaruiHUD();
      } else {
        state.salah += 1;
        feedback.className = 'error';
        feedback.innerHTML = 'Belum tepat. ' + lv.petunjuk + ' Coba lagi, jawabannya belum terkunci.';
      }
    }

    function lewatLevel() {
      if (state.index === LEVELS.length - 1) {
        resetPermainan();
        return;
      }
      state.index += 1;
      muatLevel();
    }

    /* ------------------------------------------------------------------
       Lencana dan skor
    ------------------------------------------------------------------ */
    function bukaLencana() {
      var idLevel = levelSekarang().id;
      if (idLevel.indexOf('persimpangan') === 0 || idLevel.indexOf('simpang') === 0) {
        var jalan = LEVELS.filter(function (l) { return l.id.indexOf('persimpangan') === 0 || l.id.indexOf('simpang') === 0; });
        var beres = jalan.filter(function (l) { return l.terlewati; });
        if (beres.length === jalan.length) state.lencana.ahli_persimpangan = true;
      }
      if (state.salah === 0 && state.benar === LEVELS.length) state.lencana.tanpa_salah = true;
      if (state.benar >= LEVELS.length) state.lencana.semua_level = true;
      gambarLencana();
    }

    function gambarLencana() {
      badgeRow.innerHTML = '';
      BADGE.forEach(function (b) {
        var el = document.createElement('span');
        el.className = 'lencana-item' + (state.lencana[b.id] ? ' terbuka' : '');
        el.textContent = (state.lencana[b.id] ? 'Tercapai: ' : 'Belum tercapai: ') + b.nama;
        badgeRow.appendChild(el);
      });
    }

    function perbaruiHUD() {
      levelDisplay.textContent = (state.index + 1) + ' / ' + LEVELS.length;
      scoreDisplay.textContent = String(state.skor);
      progressDisplay.textContent = state.benar + ' / ' + LEVELS.length;
      progressFill.style.width = Math.round(state.benar / LEVELS.length * 100) + '%';
      try {
        window.localStorage.setItem('s13-skor-terbaik', String(Math.max(terbaik(), state.skor)));
      } catch (e) { /* penyimpanan tidak tersedia, permainan tetap jalan */ }
    }

    function terbaik() {
      try {
        return parseInt(window.localStorage.getItem('s13-skor-terbaik') || '0', 10);
      } catch (e) {
        return 0;
      }
    }

    /* ------------------------------------------------------------------
       Atur ulang
    ------------------------------------------------------------------ */
    function resetPermainan() {
      state.index = 0;
      state.skor = 0;
      state.benar = 0;
      state.salah = 0;
      state.selesai = false;
      state.terkunci = false;
      state.lencana = {};
      LEVELS.forEach(function (l) { delete l.terlewati; });
      answerInput.disabled = false;
      nextBtn.textContent = 'Tantangan Berikutnya';
      gambarLencana();
      muatLevel();
    }

    /* ------------------------------------------------------------------
       Sambungan kontrol
    ------------------------------------------------------------------ */
    slider.addEventListener('input', function () {
      if (state.terkunci || state.selesai) return;
      setSudutDicoba(parseFloat(slider.value) || 20);
    });
    checkBtn.addEventListener('click', function () { periksa(); });
    nextBtn.addEventListener('click', lewatLevel);
    resetBtn.addEventListener('click', resetPermainan);
    window.addEventListener('pointermove', geserBusur);
    window.addEventListener('pointerup', selesaiSeretBusur);
    window.addEventListener('pointercancel', selesaiSeretBusur);
    answerInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') periksa();
    });

    gambarLencana();
    muatLevel();
    if (terbaik() > 0) {
      questionHint.textContent += ' Skor terbaikmu sebelumnya ' + terbaik() + ' poin.';
    }
  })();
  </script>
</body>
</html>
