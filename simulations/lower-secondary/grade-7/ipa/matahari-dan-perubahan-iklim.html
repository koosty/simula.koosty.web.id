:root {
  /* Colour */
  --bg: #12131d;          /* page background; also the 3D canvas background */
  --surface: #1a1b25;     /* panels, cards, step rows */
  --panel: rgba(18, 19, 36, 0.92);
  --border: rgba(138, 43, 226, 0.4);
  --border-strong: #8a2be2;
  --text: #e2e1f0;
  --text-muted: #b9cacb;
  --text-dim: #849495;
  --accent: #00f0ff;      /* primary action, slider thumb, active state */
  --accent-hover: #7df4ff;
  --accent-soft: rgba(138, 43, 226, 0.95);  /* tooltips, transient overlays */
  --success: #39ff14;     /* completion, headings, callouts */
  --warning: #ffe600;
  --error: #ff4a8d;
  --accent-text: #0b0c16;  /* text/icon colour sitting on --accent fills */
  --shadow-soft: 0 0 12px rgba(138, 43, 226, 0.25);
  --shadow-none: none;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius scale */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-pill: 999px;

  /* Type scale (system fonts only) */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --text-base: 16px;
  --text-sm: 14px;
  --text-xs: 13px;
  --text-caption: 11px;   /* uppercase control labels */
  --text-heading: 24px;
  --font-weight-display: 600;  /* headings */
  --font-weight-number: 500;   /* monospaced readouts */

  /* Focus, motion, stacking */
  --focus-ring: 0 0 0 3px rgba(0, 240, 255, 0.5);
  --motion: 0.2s;
  --motion-slow: 0.3s;
  --z-overlay: 100;        /* panels, tooltips */
  --z-modal: 1000;         /* loading screens, modal dialogs */
    }

    h1, h2, h3 { font-family: var(--font-display); }

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
}

h1, h2, h3 { font-weight: var(--font-weight-display); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: var(--space-4);
}
.panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

.btn {
  font-family: inherit;
  font-size: var(--text-sm);
  min-height: 44px;            /* never below 44px, mobile */
  min-width: 44px;
  padding: var(--space-3) var(--space-5);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--border-strong);
  color: var(--text);
  box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
  cursor: pointer;
  transition: background var(--motion);
}
.btn:hover { background: var(--text-muted); }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { background: transparent; border-color: var(--border); }
.btn-ghost:hover { background: var(--surface); }

.control-label {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

input[type="range"] {
  width: 100%; height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* Visually hidden but announced by screen readers. Use when a layout has no
   room for a visible h1 (e.g. a full-bleed canvas) — never as an excuse to
   drop a heading. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

#feedback-panel {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}
#feedback-panel.success { border-left-color: var(--success); }
#feedback-panel.error { border-left-color: var(--error); }

.progress-track {
  height: 8px;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.mono-value { font-family: var(--font-mono); font-weight: var(--font-weight-number); }

.sources {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
}
.sources-heading {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.source-item { font-size: var(--text-xs); color: var(--text-dim); margin-bottom: var(--space-1); }
.source-item a { color: var(--accent); text-decoration: none; }
.source-item a:hover { color: var(--accent-hover); text-decoration: underline; }

.reading-article {
  max-width: 720px;
  margin: 0 auto;
  line-height: 1.7;
}
.reading-article h2 { margin-top: var(--space-6); margin-bottom: var(--space-3); }
.reading-article h3 { margin-top: var(--space-5); margin-bottom: var(--space-2); }
.reading-article p, .reading-article ul, .reading-article ol, .reading-article table { margin-bottom: var(--space-4); }
.reading-article ul, .reading-article ol { padding-left: var(--space-5); }
.reading-article blockquote {
  border-left: 3px solid var(--border-strong);
  padding-left: var(--space-4);
  color: var(--text-muted);
  margin-bottom: var(--space-4);
}
.reading-article img { max-width: 100%; border-radius: var(--radius-md); }
.reading-article code { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface); padding: 2px 6px; border-radius: var(--radius-sm); }
.reading-article pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
  margin-bottom: var(--space-4);
}
.reading-article pre code { background: none; padding: 0; }
.reading-article table { width: 100%; border-collapse: collapse; }
.reading-article th, .reading-article td { border: 1px solid var(--border); padding: var(--space-2) var(--space-3); text-align: left; }
.reading-article details {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
}
.reading-article summary {
  cursor: pointer;
  font-weight: var(--font-weight-display);
  color: var(--text);
}
.reading-article details[open] summary { margin-bottom: var(--space-2); }
.glossary-term {
  text-decoration: underline dotted var(--text-dim);
  text-decoration-thickness: 1px;
  cursor: help;
}
.katex-display { margin: var(--space-4) 0; overflow-x: auto; }

/* highlight.js token colours — mapped to the token set, not a canned theme */
.hljs { color: var(--text); }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: var(--accent); }
.hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-variable, .hljs-template-tag, .hljs-template-variable { color: var(--success); }
.hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: var(--text-dim); }
.hljs-number { color: var(--warning); }

  <script type="text/markdown" id="reading-source">## Matahari sebagai Sumber Energi

Matahari adalah <span class="glossary-term" title="Bintang berwarna kuning dengan ukuran sedang dan suhu permukaan sekitar 5.800 K. Dalam klasifikasi bintang disebut kelas G.">bintang kuning kerdil</span> yang paling dekat dengan Bumi. Jaraknya sekitar 149,6 juta km, atau tepat satu <span class="glossary-term" title="Satuan jarak dalam astronomi. Satu SA sama dengan jarak rata-rata Bumi ke Matahari, yaitu 149.600.000 km.">satuan astronomi (SA)</span>. Cahaya Matahari membutuhkan waktu sekitar 8 menit 20 detik untuk sampai ke Bumi.

Matahari tersusun dari gas, terutama hidrogen dan helium. Energinya dihasilkan di bagian intinya melalui <span class="glossary-term" title="Reaksi peleburan inti hidrogen menjadi helium yang melepaskan energi dalam jumlah sangat besar.">fusi nuklir</span>, yaitu hidrogen yang melebur menjadi helium.

Energi Matahari menopang kehidupan di Bumi. Tumbuhan memakai cahaya Matahari untuk fotosintesis, Matahari menggerakkan siklus air, dan perbedaan pemanasan permukaan Bumi menimbulkan angin serta arus laut.

### Seberapa Panas Matahari?

Energi yang dipancarkan Matahari setiap detik dapat dihitung dengan hukum Stefan–Boltzmann:

$$P = 4\pi R^2 \sigma T^4$$

Keterangan: $R$ adalah jari-jari Matahari, $\sigma$ adalah tetapan Stefan–Boltzmann, dan $T$ adalah suhu permukaan Matahari. Dengan $R = 6{,}96 \times 10^{8}\ \text{m}$, $\sigma = 5{,}67 \times 10^{-8}\ \text{W·m}^{-2}\text{K}^{-4}$, dan $T = 5\,772\ \text{K}$, diperoleh:

$$P \approx 3{,}8 \times 10^{26}\ \text{W}$$

Energi yang diterima Bumi per meter persegi, dengan arah tegak lurus terhadap sinar Matahari, disebut tetapan Matahari. Nilainya sekitar $1\,361\ \text{W/m}^2$.

<details>
<summary>Pengayaan: dari mana kita tahu suhu permukaan Matahari?</summary>

Suhu permukaan Matahari dapat diperkirakan dari warna cahayanya. Puncak spektrum cahaya Matahari berada di sekitar panjang gelombang $500\ \text{nm}$. Dengan hukum pergeseran Wien, $\lambda_{\text{maks}} \cdot T \approx 2{,}9 \times 10^{-3}\ \text{m·K}$, sehingga $T \approx \dfrac{2{,}9 \times 10^{-3}}{500 \times 10^{-9}}\ \text{K} \approx 5\,800\ \text{K}$.

</details>

## Perubahan Iklim

<span class="glossary-term" title="Rata-rata kondisi cuaca di suatu wilayah dalam jangka panjang, biasanya diukur selama lebih dari 30 tahun.">Iklim</span> adalah rata-rata kondisi cuaca di suatu wilayah dalam jangka panjang. Perubahan iklim terjadi ketika rata-rata itu bergeser secara jangka panjang, misalnya suhu rata-rata Bumi yang terus naik dari tahun ke tahun.

Ada beberapa faktor yang dapat memengaruhi iklim Bumi:

| Faktor | Cara memengaruhi iklim |
|---|---|
| Aktivitas manusia | Pembakaran bahan bakar fosil dan penebangan hutan menambah <span class="glossary-term" title="Gas di atmosfer yang menahan panas dari permukaan Bumi, seperti karbon dioksida dan metana.">gas rumah kaca</span> di atmosfer. |
| Tektonik lempeng | Pergeseran lempeng mengubah letak daratan dan lautan, sehingga arus laut dan pola angin ikut berubah dalam skala jutaan tahun. |
| Aktivitas Matahari | Intensitas sinar Matahari berubah sedikit mengikuti siklus sekitar 11 tahun. |
| Vulkanik | Letusan besar mengeluarkan <span class="glossary-term" title="Partikel halus di udara yang dapat memantulkan sinar Matahari kembali ke angkasa.">aerosol</span> ke atmosfer, sehingga suhu permukaan dapat turun sementara. |

### Aktivitas Manusia sebagai Penyebab Utama Pemanasan

Sebagian besar ilmuwan sepakat bahwa aktivitas manusia adalah penyebab utama pemanasan global sejak pertengahan abad ke-20. Karbon dioksida ($\text{CO}_2$) dari pembakaran bahan bakar fosil dan metana ($\text{CH}_4$) dari sawah, peternakan, dan tempat pembuangan sampah menahan panas di atmosfer. Penebangan hutan juga mengurangi kemampuan Bumi menyerap karbon dioksida.

### Matahari, Gunung Api, dan Lempeng Bumi

Aktivitas Matahari memang berubah. Intensitas radiasinya naik dan turun mengikuti siklus sekitar 11 tahun. Perubahan ini kecil dibandingkan dengan dampak gas rumah kaca dalam beberapa dekade terakhir.

Letusan gunung api besar dapat mendinginkan Bumi untuk sementara. Aerosol sulfur yang mencapai lapisan atas atmosfer memantulkan sebagian sinar Matahari kembali ke angkasa. Efek ini biasanya berlangsung beberapa tahun, lalu hilang ketika aerosol mengendap.

## Ringkasan

- Matahari adalah bintang kuning kerdil dan sumber energi utama bagi kehidupan di Bumi.
- Iklim adalah rata-rata cuaca dalam jangka panjang, sedangkan perubahan iklim adalah pergeseran rata-rata itu.
- Penyebab perubahan iklim meliputi aktivitas manusia, tektonik lempeng, aktivitas Matahari, dan vulkanik.
- Aktivitas manusia menjadi penyebab utama pemanasan global dalam beberapa dekade terakhir.

## Latihan Singkat

<details>
<summary>1. Musim kemarau tahun ini lebih panjang dari biasanya. Apakah itu berarti iklim sudah berubah?</summary>

Belum tentu. Iklim adalah rata-rata cuaca dalam jangka panjang. Satu musim yang tidak biasa belum cukup untuk menyatakan bahwa iklim berubah. Perlu dilihat pola rata-rata selama bertahun-tahun.

</details>

<details>
<summary>2. Sebuah letusan gunung api membuat suhu permukaan Bumi turun selama beberapa tahun. Termasuk faktor apakah itu?</summary>

Faktor vulkanik. Aerosol dari letusan memantulkan sinar Matahari kembali ke angkasa, sehingga suhu permukaan turun untuk sementara.

</details>

<details>
<summary>3. Sebuah panel surya seluas $2\ \text{m}^2$ menghadap tegak lurus ke Matahari. Berapa energi yang diterima panel selama 1 jam jika tetapan Matahari $1\,361\ \text{W/m}^2$?</summary>

Daya yang diterima adalah $P = 1\,361\ \text{W/m}^2 \times 2\ \text{m}^2 = 2\,722\ \text{W}$. Energi selama $t = 1\ \text{jam} = 3\,600\ \text{s}$ adalah $E = P \cdot t = 2\,722\ \text{W} \times 3\,600\ \text{s} \approx 9{,}8 \times 10^{6}\ \text{J}$.

</details>
