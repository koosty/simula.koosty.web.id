:root {
  /* Colour */
  --bg: #12131d;          /* page background; also the 3D canvas background */
  --surface: #1a1b25;     /* panels, cards, step rows */
  --panel: #1e1f2a;
  --border: #3b494b;
  --border-strong: #849495;
  --text: #e2e1f0;
  --text-muted: #b9cacb;
  --text-dim: #849495;
  --accent: #00f0ff;      /* primary action, slider thumb, active state */
  --accent-hover: #7df4ff;
  --accent-soft: rgba(138, 43, 226, 0.95);  /* tooltips, transient overlays */
  --success: #39ff14;     /* completion, headings, callouts */
  --warning: #ffe600;
  --error: #ff4a8d;
  --accent-text: #0b0c16;  /* text/icon colour sitting on --accent fills */
  --shadow-soft: 0 0 12px rgba(138, 43, 226, 0.25);
  --shadow-none: none;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius scale */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-pill: 999px;

  /* Type scale (system fonts only) */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --text-base: 16px;
  --text-sm: 14px;
  --text-xs: 13px;
  --text-caption: 11px;   /* uppercase control labels */
  --text-heading: 24px;
  --font-weight-display: 600;  /* headings */
  --font-weight-number: 500;   /* monospaced readouts */

  /* Focus, motion, stacking */
  --focus-ring: 0 0 0 3px rgba(0, 240, 255, 0.5);
  --motion: 0.2s;
  --motion-slow: 0.3s;
  --z-overlay: 100;        /* panels, tooltips */
  --z-modal: 1000;         /* loading screens, modal dialogs */
    }

    h1, h2, h3 { font-family: var(--font-display); }


* { margin: 0; padding: 0; box-sizing: border-box; }

  font-family: var(--font);

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: var(--space-4);
}
.panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

.btn {
  font-family: inherit;
  font-size: var(--text-sm);
  min-height: 44px;            /* never below 44px, mobile */
  min-width: 44px;
  padding: var(--space-3) var(--space-5);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--border-strong);
  color: var(--bg);
  box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
  cursor: pointer;
  transition: background var(--motion);
}
.btn:hover { background: var(--text-muted); }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

.btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }

.control-label {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);

input[type="range"] {

<body>
  <main class="page">
    <header class="panel">
      <h1>Model Partikel: Padat, Cair, dan Gas</h1>
      <p class="muted">Pilih wujud zat dan atur suhunya. Amati susunan partikel, lalu tekan Mulai untuk melihat cara partikel bergerak.</p>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="controls-heading">
        <h2 class="panel-heading" id="controls-heading">Atur zat</h2>

        <div class="control-group">
          <div class="control-label-row">
            <span class="control-label">Wujud zat</span>
            <span class="role">Pilih satu</span>
          </div>
          <div class="choice-row" role="group" aria-label="Wujud zat">
            <button type="button" class="btn" id="padat-btn" aria-pressed="true">Padat</button>
            <button type="button" class="btn" id="cair-btn" aria-pressed="false">Cair</button>
            <button type="button" class="btn" id="gas-btn" aria-pressed="false">Gas</button>
          </div>
        </div>

        <div class="control-group">
          <div class="control-label-row">
            <label class="control-label" for="suhu-slider">Suhu</label>
            <span class="role">Dapat diubah</span>
          </div>
          <input type="range" id="suhu-slider" min="0" max="100" step="1" value="20" aria-describedby="suhu-display">
          <span class="mono-value" id="suhu-display">20 °C</span>
        </div>

        <div class="readout">
          <div class="readout-row"><span>Energi gerak (relatif)</span><strong class="mono-value" id="energy-display">0 %</strong></div>
        </div>

        <p class="description" id="state-description" style="margin-top: var(--space-4);"></p>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="start-btn">Mulai</button>
          <button type="button" class="btn btn-ghost" id="reset-btn">Reset</button>
        </div>

        <div class="presets" aria-label="Contoh pengaturan">
          <button type="button" class="btn" id="preset-1-btn">Padat pada 0 °C</button>
          <button type="button" class="btn" id="preset-2-btn">Gas pada 100 °C</button>
        </div>
        <p class="hint">Spasi: mulai atau jeda · R: reset</p>
      </section>

      <section class="panel stage" aria-labelledby="stage-heading">
        <h2 class="panel-heading" id="stage-heading">Susunan partikel</h2>
        <canvas class="stage-canvas" id="particle-canvas" role="img" aria-label="Animasi partikel dalam wadah sesuai wujud dan suhu zat"></canvas>
      </section>
    </div>
  </main>

  <script type="application/json" id="widget-config">
{
  "type": "simulation",
  "concept": "model_partikel",
  "description": "Susunan dan gerak partikel pada wujud padat, cair, dan gas. Suhu mengubah energi gerak partikel.",
  "variables": [
    { "name": "suhu", "label": "Suhu", "min": 0, "max": 100, "default": 20, "unit": "°C" }
  ],
  "presets": [
    { "name": "Padat pada 0 °C", "variables": { "wujud": "padat", "suhu": 0 } },
    { "name": "Gas pada 100 °C", "variables": { "wujud": "gas", "suhu": 100 } }
  ]
}
  </script>

  <script>
    (function () {
      'use strict';

      var N = 36;
      var COLS = 6;
      var ROWS = 6;
      var DEFAULT_WUJUD = 'padat';
      var DEFAULT_SUHU = 20;
      var DESCRIPTIONS = {
        padat: 'Partikel padat tersusun rapat dan hanya bergetar di tempatnya. Bentuk dan volumenya tetap.',
        cair: 'Partikel cair masih berdekatan, tetapi dapat bergerak lebih bebas. Bentuknya mengikuti wadah, volumenya tetap.',
        gas: 'Partikel gas berjauhan dan bergerak bebas ke segala arah. Gas menyebar hingga memenuhi seluruh wadah.'
      };

      var canvas = document.getElementById('particle-canvas');
      var ctx = canvas ? canvas.getContext('2d') : null;
      var cssW = 0;
      var cssH = 0;
      var dpr = 1;
      var layout = { x: 0, y: 0, w: 0, h: 0, unit: 1 };
      var particles = [];
      var time = 0;
      var lastTs = 0;
      var state = freshState(DEFAULT_WUJUD, DEFAULT_SUHU);

      function $(id) { return document.getElementById(id); }
      function setText(el, t) { if (el) el.textContent = t; }
      function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

      function freshState(wujud, suhu) {
        return { wujud: wujud, suhu: suhu, running: false };
      }

      function speedFactor() { return 0.05 + (state.suhu / 100) * 0.95; }

      function computeLayout() {
        var margin = 16;
        var bottomLabel = 44;
        layout.x = margin;
        layout.y = margin;
        layout.w = Math.max(0, cssW - margin * 2);
        layout.h = Math.max(0, cssH - margin * 2 - bottomLabel);
        layout.unit = Math.min(layout.w, layout.h) / COLS;
      }

      function initParticles() {
        particles = [];
        for (var i = 0; i < N; i++) {
          var c = i % COLS;
          var r = Math.floor(i / COLS);
          var p = { x: 0, y: 0, hx: 0, hy: 0, dx: 0, dy: 0, phase: Math.random() * Math.PI * 2 };
          if (state.wujud === 'padat') {
            p.hx = layout.x + layout.w * (c + 0.5) / COLS;
            p.hy = layout.y + layout.h * (r + 0.5) / ROWS;
            p.x = p.hx;
            p.y = p.hy;
          } else {
            var minY = state.wujud === 'cair' ? layout.y + layout.h * 0.4 : layout.y;
            p.x = layout.x + Math.random() * layout.w;
            p.y = minY + Math.random() * (layout.y + layout.h - minY);
            var angle = Math.random() * Math.PI * 2;
            p.dx = Math.cos(angle);
            p.dy = Math.sin(angle);
          }
          particles.push(p);
        }
      }

      function stepParticles(dt) {
        time += dt;
        if (state.wujud === 'padat') {
          var amp = layout.unit * (0.04 + 0.22 * (state.suhu / 100));
          var w = 3 + 4 * (state.suhu / 100);
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x = p.hx + amp * Math.cos(time * w + p.phase);
            p.y = p.hy + amp * Math.sin(time * w * 1.3 + p.phase);
          }
          return;
        }

        var speed = layout.unit * (state.wujud === 'cair' ? 0.5 : 1.6) * speedFactor();
        var minY = state.wujud === 'cair' ? layout.y + layout.h * 0.4 : layout.y;
        var maxX = layout.x + layout.w;
        var maxY = layout.y + layout.h;
        for (var j = 0; j < particles.length; j++) {
          var q = particles[j];
          q.x += q.dx * speed * dt;
          q.y += q.dy * speed * dt;
          if (q.x < layout.x) { q.x = layout.x; q.dx = Math.abs(q.dx); }
          if (q.x > maxX) { q.x = maxX; q.dx = -Math.abs(q.dx); }
          if (q.y < minY) { q.y = minY; q.dy = Math.abs(q.dy); }
          if (q.y > maxY) { q.y = maxY; q.dy = -Math.abs(q.dy); }
        }
      }

      function draw() {
        if (!ctx || !cssW) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var colors = {
          bg: cssVar('--bg'),
          surface: cssVar('--surface'),
          border: cssVar('--border-strong'),
          accent: cssVar('--accent'),
          muted: cssVar('--text-muted'),
          font: cssVar('--font'),
          mono: cssVar('--font-mono')
        };

        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, cssW, cssH);

        ctx.fillStyle = colors.surface;
        ctx.fillRect(layout.x, layout.y, layout.w, layout.h);
        ctx.strokeStyle = colors.border;
        ctx.lineWidth = 2;
        ctx.strokeRect(layout.x, layout.y, layout.w, layout.h);

        var radius = Math.max(5, layout.unit * 0.24);
        ctx.fillStyle = colors.accent;
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }

        var names = { padat: 'Padat', cair: 'Cair', gas: 'Gas' };
        ctx.fillStyle = colors.muted;
        ctx.font = '13px ' + colors.font;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Wujud: ' + names[state.wujud], layout.x, cssH - 22);
        ctx.font = '500 13px ' + colors.mono;
        ctx.textAlign = 'right';
        ctx.fillText(state.suhu + ' °C', layout.x + layout.w, cssH - 22);
      }

      function setPressed(id, on) {
        var btn = $(id);
        if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      }

      function updateUI() {
        setPressed('padat-btn', state.wujud === 'padat');
        setPressed('cair-btn', state.wujud === 'cair');
        setPressed('gas-btn', state.wujud === 'gas');

        setText($('suhu-display'), state.suhu + ' °C');
        var slider = $('suhu-slider');
        if (slider) slider.value = String(state.suhu);

        setText($('energy-display'), Math.round(speedFactor() * 100) + ' %');
        setText($('state-description'), DESCRIPTIONS[state.wujud]);
        setText($('start-btn'), state.running ? 'Jeda' : 'Mulai');
      }

      function setWujud(w) {
        state.wujud = w;
        state.running = false;
        initParticles();
        updateUI();
        draw();
      }

      function setSuhu(v) {
        state.suhu = v;
        updateUI();
        draw();
      }

      function toggleRun() {
        state.running = !state.running;
        updateUI();
      }

      function resetAll() {
        state = freshState(DEFAULT_WUJUD, DEFAULT_SUHU);
        time = 0;
        initParticles();
        updateUI();
        draw();
      }

      function applyPreset(wujud, suhu) {
        state.wujud = wujud;
        state.suhu = suhu;
        state.running = false;
        time = 0;
        initParticles();
        updateUI();
        draw();
      }

      function resize() {
        if (!canvas) return;
        dpr = window.devicePixelRatio || 1;
        cssW = canvas.clientWidth;
        cssH = Math.round(Math.min(420, Math.max(300, cssW * 0.7)));
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        computeLayout();
        initParticles();
        draw();
      }

      function loop(ts) {
        var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
        lastTs = ts;
        if (state.running) stepParticles(dt);
        draw();
        window.requestAnimationFrame(loop);
      }

      function bind() {
        var map = [
          ['padat-btn', function () { setWujud('padat'); }],
          ['cair-btn', function () { setWujud('cair'); }],
          ['gas-btn', function () { setWujud('gas'); }],
          ['start-btn', toggleRun],
          ['reset-btn', resetAll],
          ['preset-1-btn', function () { applyPreset('padat', 0); }],
          ['preset-2-btn', function () { applyPreset('gas', 100); }]
        ];
        map.forEach(function (pair) {
          var el = $(pair[0]);
          if (el) el.addEventListener('click', pair[1]);
        });

        var slider = $('suhu-slider');
        if (slider) slider.addEventListener('input', function () { setSuhu(Number(slider.value)); });

        document.addEventListener('keydown', function (e) {
          var tag = e.target && e.target.tagName ? e.target.tagName : '';
          if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'INPUT') {
            e.preventDefault();
            toggleRun();
          } else if ((e.key === 'r' || e.key === 'R') && tag !== 'INPUT') {
            resetAll();
          }
        });
      }

      if (typeof ResizeObserver !== 'undefined' && canvas) {
        new ResizeObserver(resize).observe(canvas);
      } else {
        window.addEventListener('resize', resize);
      }

      bind();
      updateUI();
      resize();
      window.requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
