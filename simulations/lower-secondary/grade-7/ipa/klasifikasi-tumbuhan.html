:root {
  /* Colour */
  --bg: #0b0c16;          /* page background; also the 3D canvas background */
  --surface: #1a1b32;     /* panels, cards, step rows */
  --panel: rgba(18, 19, 36, 0.92);
  --border: rgba(138, 43, 226, 0.4);
  --border-strong: #8a2be2;
  --text: #e2e1f0;
  --text-muted: #b9cacb;
  --text-dim: #849495;
  --accent: #00f0ff;      /* primary action, slider thumb, active state */
  --accent-hover: #7df4ff;
  --accent-soft: rgba(138, 43, 226, 0.95);  /* tooltips, transient overlays */
  --success: #39ff14;     /* completion, headings, callouts */
  --warning: #ffe600;
  --error: #ff4a8d;
  --accent-text: #0b0c16;  /* text/icon colour sitting on --accent fills */
  --shadow-soft: 0 0 12px rgba(138, 43, 226, 0.25);
  --shadow-none: none;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius scale */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-pill: 999px;

  /* Type scale (system fonts only) */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --text-base: 16px;
  --text-sm: 14px;
  --text-xs: 13px;
  --text-caption: 11px;   /* uppercase control labels */
  --text-heading: 24px;
  --font-weight-display: 600;  /* headings */
  --font-weight-number: 500;   /* monospaced readouts */

  /* Focus, motion, stacking */
  --focus-ring: 0 0 0 3px rgba(0, 240, 255, 0.5);
  --motion: 0.2s;
  --motion-slow: 0.3s;
  --z-overlay: 100;        /* panels, tooltips */
  --z-modal: 1000;         /* loading screens, modal dialogs */

    h1, h2, h3 { font-family: var(--font-display); }

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
}

h1, h2, h3 { font-weight: var(--font-weight-display); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: var(--space-4);
}
.panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

.btn {
  font-family: inherit;
  font-size: var(--text-sm);
  min-height: 44px;            /* never below 44px, mobile */
  min-width: 44px;
  padding: var(--space-3) var(--space-5);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--border-strong);
  color: var(--text);
  box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
  cursor: pointer;
  transition: background var(--motion);
}
.btn:hover { background: var(--text-muted); }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { background: transparent; border-color: var(--border); }
.btn-ghost:hover { background: var(--surface); }

.control-label {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

input[type="range"] {
  width: 100%; height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  background: var(--accent);
  border-radius: 50%;

}

.reading-article details {

/* highlight.js token colours — mapped to the token set, not a canned theme */

.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: var(--accent); }
.hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-variable, .hljs-template-tag, .hljs-template-variable { color: var(--success); }
.hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: var(--text-dim); }
.hljs-number { color: var(--warning); }

    /* Page layout only: every colour, radius, and spacing comes from the shared tokens above. */
    [hidden] { display: none !important; }
    .app { max-width: 1000px; margin: 0 auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    .node { cursor: pointer; outline: none; }

    .node:hover .node-body { transform: translateY(-4px); }

    .node-box { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
    .node.node-root .node-box { fill: var(--accent); stroke: var(--accent-hover); }
    .node.is-selected .node-box { stroke: var(--success); stroke-width: 3; }
    .node:focus-visible .node-box { stroke: var(--success); stroke-width: 4; }
    .node-label { fill: var(--text); font-size: 15px; font-weight: 600; font-family: var(--font); }
    .node.node-root .node-label { fill: var(--accent-text); }
    .node-icon { font-size: 20px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-2); margin-top: var(--space-4); }

    .detail-title { font-size: var(--text-base); font-weight: var(--font-weight-display); color: var(--success); margin-bottom: var(--space-2); }
    #detail-text { color: var(--text); }

<body>
<div class="app">
  <header class="intro">
    <h1>Klasifikasi Tumbuhan</h1>
    <p>Tumbuhan pertama-tama dibedakan dari ada tidaknya biji. Tumbuhan berbiji kemudian dibedakan dari letak bijinya, lalu dari tulang daunnya. Tekan Berikutnya untuk membuka tiap cabang.</p>
  </header>

  <section class="panel">
    <div class="diagram-wrap">
      <svg id="diagram" viewBox="0 0 1050 630" role="img" aria-label="Diagram klasifikasi tumbuhan: tumbuhan berspora, tumbuhan berbiji dengan Gymnospermae dan Angiospermae, serta Angiospermae dengan dikotil dan monokotil"></svg>
    </div>
    <div class="controls">
      <button class="btn" id="prev-btn" type="button">Sebelumnya</button>
      <span id="step-display" aria-live="polite"></span>
      <button class="btn btn-primary" id="next-btn" type="button">Berikutnya</button>
      <button class="btn btn-ghost" id="reset-btn" type="button">Atur ulang</button>
    </div>
  </section>

  <section class="panel" aria-live="polite">
    <h2 class="detail-title" id="detail-title"></h2>
    <p id="detail-text"></p>
  </section>
</div>

<script>
(function () {
  'use strict';

  const CFG = JSON.parse(document.getElementById('widget-config').textContent);
  const NS = 'http://www.w3.org/2000/svg';
  const NODE_WIDTH = 180;
  const NODE_HEIGHT = 70;
  const ARROW_OFFSET = 10;
  // Tata letak kiri ke kanan: setiap kolom adalah satu tingkat klasifikasi.
  const POS = {
    'tumbuhan': { x: 120, y: 300 },
    'berspora': { x: 390, y: 150 },
    'berbiji': { x: 390, y: 380 },
    'gymno': { x: 660, y: 280 },
    'angio': { x: 660, y: 480 },
    'dikot': { x: 930, y: 400 },
    'monok': { x: 930, y: 560 }
  };

  const svg = document.getElementById('diagram');
  const $ = (id) => document.getElementById(id);
  const setText = (id, text) => {
    const el = $(id);
    if (el) el.textContent = text;
  };
  const byId = Object.fromEntries(CFG.nodes.map((n) => [n.id, n]));
  const order = CFG.revealOrder;
  let revealed = 1;
  let selectedId = order[0];

  function make(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach((k) => node.setAttribute(k, String(attrs[k])));
    if (parent) parent.appendChild(node);
    return node;
  }

  // Geometri sambungan: sisi terdekat dari dua node, dengan jarak untuk ujung panah.
  function edgeGeometry(from, to) {
    const a = POS[from];
    const b = POS[to];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    let sx, sy, ex, ey;
    if (Math.abs(dy) > Math.abs(dx)) {
      sx = a.x;
      sy = dy > 0 ? a.y + NODE_HEIGHT / 2 : a.y - NODE_HEIGHT / 2;
      ex = b.x;
      ey = dy > 0 ? b.y - NODE_HEIGHT / 2 - ARROW_OFFSET : b.y + NODE_HEIGHT / 2 + ARROW_OFFSET;
    } else {
      sx = dx > 0 ? a.x + NODE_WIDTH / 2 : a.x - NODE_WIDTH / 2;
      sy = a.y;
      ex = dx > 0 ? b.x - NODE_WIDTH / 2 - ARROW_OFFSET : b.x + NODE_WIDTH / 2 + ARROW_OFFSET;
      ey = b.y;
    }
    return { d: `M ${sx} ${sy} L ${ex} ${ey}`, mx: (sx + ex) / 2, my: (sy + ey) / 2 };
  }

  function isVisible(id) {
    return order.indexOf(id) >= 0 && order.indexOf(id) < revealed;
  }

  function select(id) {
    if (!isVisible(id)) return;
    selectedId = id;
    render();
  }

  function build() {
    const defs = make('defs', {}, svg);
    const marker = make('marker', { id: 'arrow-head', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
    make('path', { d: 'M 0 0 L 10 5 L 0 10 z', class: 'arrow-head' }, marker);

    CFG.edges.forEach((e) => {
      const g = make('g', { id: `edge-${e.from}-${e.to}` }, svg);
      const geom = edgeGeometry(e.from, e.to);
      make('path', { d: geom.d, class: 'edge', 'marker-end': 'url(#arrow-head)' }, g);
      if (e.label) {
        const label = make('text', { x: geom.mx, y: geom.my - 8, class: 'edge-label', 'text-anchor': 'middle' }, g);
        label.textContent = e.label;
      }
    });

    CFG.nodes.forEach((n) => {
      const p = POS[n.id];
      const isRoot = n.id === order[0];
      const g = make('g', {
        id: `node-${n.id}`,
        class: `node${isRoot ? ' node-root' : ''}`,
        transform: `translate(${p.x}, ${p.y})`,
        tabindex: '0',
        role: 'button',
        'aria-label': n.label
      }, svg);
      g.addEventListener('click', () => select(n.id));
      g.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          select(n.id);
        }
      });
      const body = make('g', { class: 'node-body' }, g);
      make('rect', { x: -NODE_WIDTH / 2, y: -NODE_HEIGHT / 2, width: NODE_WIDTH, height: NODE_HEIGHT, rx: 12, class: 'node-box' }, body);
      const icon = make('text', { x: -NODE_WIDTH / 2 + 22, y: 7, class: 'node-icon', 'text-anchor': 'middle' }, body);
      icon.textContent = n.icon;
      const label = make('text', { x: 12, y: 6, class: 'node-label', 'text-anchor': 'middle' }, body);
      label.textContent = n.label;
    });
  }

  function render() {
    CFG.nodes.forEach((n) => {
      const g = $(`node-${n.id}`);
      if (!g) return;
      const visible = isVisible(n.id);
      g.style.display = visible ? '' : 'none';
      g.classList.toggle('is-selected', n.id === selectedId);
      g.setAttribute('tabindex', visible ? '0' : '-1');
    });
    CFG.edges.forEach((e) => {
      const g = $(`edge-${e.from}-${e.to}`);
      if (g) g.style.display = isVisible(e.from) && isVisible(e.to) ? '' : 'none';
    });
    const prev = $('prev-btn');
    const next = $('next-btn');
    if (prev) prev.disabled = revealed <= 1;
    if (next) next.disabled = revealed >= order.length;
    setText('step-display', `Langkah ${revealed} dari ${order.length}`);
    const node = byId[selectedId];
    if (node) {
      setText('detail-title', node.label);
      setText('detail-text', node.details);
    }
  }

  function next() {
    if (revealed >= order.length) return;
    revealed += 1;
    selectedId = order[revealed - 1];
    render();
  }

  function prev() {
    if (revealed <= 1) return;
    revealed -= 1;
    selectedId = order[revealed - 1];
    render();
  }

  function reset() {
    revealed = 1;
    selectedId = order[0];
    render();
  }

  const nextBtn = $('next-btn');
  const prevBtn = $('prev-btn');
  const resetBtn = $('reset-btn');
  if (nextBtn) nextBtn.addEventListener('click', next);
  if (prevBtn) prevBtn.addEventListener('click', prev);
  if (resetBtn) resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  build();
  render();
})();
</script>

<script type="application/json" id="widget-config">
{
  "type": "diagram",
