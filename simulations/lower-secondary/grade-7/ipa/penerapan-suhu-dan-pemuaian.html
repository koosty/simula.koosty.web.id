:root {
  /* Colour */
  --bg: #12131d;          /* page background; also the 3D canvas background */
  --surface: #1a1b25;     /* panels, cards, step rows */
  --panel: rgba(18, 19, 36, 0.92);
  --border: rgba(138, 43, 226, 0.4);
  --border-strong: #8a2be2;
  --text: #e2e1f0;
  --text-muted: #b9cacb;
  --text-dim: #849495;
  --accent: #00f0ff;      /* primary action, slider thumb, active state */
  --accent-hover: #7df4ff;
  --accent-soft: rgba(138, 43, 226, 0.95);  /* tooltips, transient overlays */
  --success: #39ff14;     /* completion, headings, callouts */
  --warning: #ffe600;
  --error: #ff4a8d;
  --accent-text: #0b0c16;  /* text/icon colour sitting on --accent fills */
  --shadow-soft: 0 0 12px rgba(138, 43, 226, 0.25);
  --shadow-none: none;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius scale */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-pill: 999px;

  /* Type scale (system fonts only) */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --text-base: 16px;
  --text-sm: 14px;
  --text-xs: 13px;
  --text-caption: 11px;   /* uppercase control labels */
  --text-heading: 24px;
  --font-weight-display: 600;  /* headings */
  --font-weight-number: 500;   /* monospaced readouts */

  /* Focus, motion, stacking */
  --focus-ring: 0 0 0 3px rgba(0, 240, 255, 0.5);
  --motion: 0.2s;
  --motion-slow: 0.3s;
  --z-overlay: 100;        /* panels, tooltips */
  --z-modal: 1000;         /* loading screens, modal dialogs */
    }

    h1, h2, h3 { font-family: var(--font-display); }


* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
}

h1, h2, h3 { font-weight: var(--font-weight-display); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: var(--space-4);
}
.panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

.btn {
  font-family: inherit;
  font-size: var(--text-sm);
  min-height: 44px;            /* never below 44px, mobile */
  min-width: 44px;
  padding: var(--space-3) var(--space-5);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--border-strong);
  color: var(--text);
  box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
  cursor: pointer;
  transition: background var(--motion);
}
.btn:hover { background: var(--text-muted); }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { background: transparent; border-color: var(--border); }
.btn-ghost:hover { background: var(--surface); }

.control-label {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

input[type="range"] {
  width: 100%; height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* Visually hidden but announced by screen readers. Use when a layout has no
   room for a visible <h1> (e.g. a full-bleed canvas) — never as an excuse to
   drop a heading. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

#feedback-panel {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}
#feedback-panel.success { border-left-color: var(--success); }
#feedback-panel.error { border-left-color: var(--error); }

.progress-track {
  height: 8px;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.mono-value { font-family: var(--font-mono); font-weight: var(--font-weight-number); }

.sources {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
}
.sources-heading {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.source-item { font-size: var(--text-xs); color: var(--text-dim); margin-bottom: var(--space-1); }
.source-item a { color: var(--accent); text-decoration: none; }
.source-item a:hover { color: var(--accent-hover); text-decoration: underline; }

.reading-article {
  max-width: 720px;
  margin: 0 auto;
  line-height: 1.7;
}
.reading-article h2 { margin-top: var(--space-6); margin-bottom: var(--space-3); }
.reading-article h3 { margin-top: var(--space-5); margin-bottom: var(--space-2); }
.reading-article p, .reading-article ul, .reading-article ol, .reading-article table { margin-bottom: var(--space-4); }
.reading-article ul, .reading-article ol { padding-left: var(--space-5); }
.reading-article blockquote {
  border-left: 3px solid var(--border-strong);
  padding-left: var(--space-4);
  color: var(--text-muted);
  margin-bottom: var(--space-4);
}
.reading-article img { max-width: 100%; border-radius: var(--radius-md); }
.reading-article code { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface); padding: 2px 6px; border-radius: var(--radius-sm); }
.reading-article pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
  margin-bottom: var(--space-4);
}
.reading-article pre code { background: none; padding: 0; }
.reading-article table { width: 100%; border-collapse: collapse; }
.reading-article th, .reading-article td { border: 1px solid var(--border); padding: var(--space-2) var(--space-3); text-align: left; }
.reading-article details {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
}
.reading-article summary {
  cursor: pointer;
  font-weight: var(--font-weight-display);
  color: var(--text);
}
.reading-article details[open] summary { margin-bottom: var(--space-2); }
.glossary-term {
  text-decoration: underline dotted var(--text-dim);
  text-decoration-thickness: 1px;
  cursor: help;
}
.katex-display { margin: var(--space-4) 0; overflow-x: auto; }

/* highlight.js token colours — mapped to the token set, not a canned theme */
.hljs { color: var(--text); }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: var(--accent); }
.hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-variable, .hljs-template-tag, .hljs-template-variable { color: var(--success); }
.hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: var(--text-dim); }
.hljs-number { color: var(--warning); }

  <script type="text/markdown" id="reading-source">## Termometer: membaca suhu lewat pemuaian

Pernahkah kamu melihat termometer raksa di ruang kesehatan sekolah? Di dalam tabung kaca yang sempit terdapat cairan perak yang naik ketika termometer dipanaskan. Cairan itu naik karena zatnya memuai. Inilah prinsip dasar termometer: <span class="glossary-term" title="Pemuaian: bertambahnya ukuran (panjang, luas, atau volume) suatu zat karena kenaikan suhu.">pemuaian</span> dipakai untuk membaca suhu.

### Kesetimbangan suhu

Saat termometer disentuhkan ke dahi, terjadi <span class="glossary-term" title="Keadaan ketika dua benda yang bersentuhan sudah bersuhu sama, sehingga tidak ada lagi perpindahan kalor di antara keduanya.">kesetimbangan suhu</span>. Kalor berpindah dari dahi ke termometer sampai suhu keduanya sama. Pada saat itu cairan di dalam termometer berhenti naik, dan skala menunjukkan suhu tubuh.

Ada dua hal penting yang perlu diingat:

- Termometer menunjukkan suhunya sendiri. Ia dapat membaca suhu tubuh karena sudah mencapai kesetimbangan dengan tubuh.
- Bacaan harus ditunggu sampai stabil. Jika belum setimbang, bacaannya belum tepat.

Hubungan volume cairan dengan suhu dapat ditulis sebagai berikut.

$$
V_t = V_0 (1 + \gamma \Delta T)
$$

Di sini $V_0$ adalah volume awal, $\gamma$ (dibaca gamma) adalah koefisien muai volume, dan $\Delta T$ adalah kenaikan suhu. Koefisien muai cairan biasanya kecil, sehingga kenaikan volumenya hanya terlihat jelas jika tabungnya sangat sempit. Itulah sebabnya tabung termometer dibuat kecil.

## Bimetal: dua logam yang saling mengunci

Bimetal adalah dua lempeng logam yang berbeda jenis, lalu disatukan dengan rapat. Contohnya tembaga dan besi. Kedua logam itu memuai dengan <span class="glossary-term" title="Koefisien muai panjang: bilangan yang menyatakan pertambahan panjang suatu zat untuk setiap 1 meter panjang awal dan setiap kenaikan suhu 1 °C.">koefisien muai</span> yang berbeda.

Ketika dipanaskan, logam yang koefisien muainya lebih besar memuai lebih banyak. Karena kedua logam terikat erat, pasangan ini tidak bisa memuai bebas. Akibatnya, bimetal melengkung ke arah logam yang memuai lebih sedikit.

Pertambahan panjang suatu batang dinyatakan dengan rumus berikut.

$$
\Delta L = L_0 \alpha \Delta T
$$

- $L_0$ adalah panjang awal (m).
- $\alpha$ (dibaca alfa) adalah koefisien muai panjang (per °C).
- $\Delta T$ adalah kenaikan suhu (°C).
- $\Delta L$ adalah pertambahan panjang (m).

### Contoh perhitungan

Sebuah batang besi berpanjang $2\ \text{m}$ dipanaskan dari $25\ ^\circ\text{C}$ hingga $75\ ^\circ\text{C}$. Koefisien muai panjang besi adalah $\alpha = 12 \times 10^{-6}\ /^\circ\text{C}$.

1. Tentukan kenaikan suhu: $\Delta T = 75 - 25 = 50\ ^\circ\text{C}$.
2. Masukkan nilai ke rumus: $\Delta L = 2 \times 12 \times 10^{-6} \times 50$.
3. Hitung hasilnya: $\Delta L = 1{,}2 \times 10^{-3}\ \text{m}$.
4. Ubah ke milimeter: $\Delta L = 1{,}2\ \text{mm}$.

Jadi batang besi itu bertambah panjang sekitar 1,2 mm.

### Penerapan bimetal

- **Saklar termostat** pada setrika dan dispenser air panas. Saat suhu naik, bimetal melengkung dan memutus aliran listrik.
- **Alarm kebakaran sederhana.** Saat suhu sangat tinggi, bimetal melengkung dan menyentuh kontak listrik sehingga alarm berbunyi.

## Balon udara: udara panas yang lebih ringan

Balon udara dapat terbang karena udara di dalamnya dipanaskan. Ketika suhu naik, udara memuai dan volumenya bertambah. Massa udara di dalam balon tetap, tetapi volumenya lebih besar, sehingga <span class="glossary-term" title="Massa jenis: massa per satuan volume, dirumuskan rho = m / V, dengan satuan kg/m³.">massa jenisnya</span> turun. Udara panas yang lebih ringan daripada udara dingin di sekitarnya menghasilkan gaya ke atas yang dapat mengangkat balon.

Pada tekanan tetap, volume gas sebanding dengan suhu mutlaknya. Hubungannya dapat ditulis sebagai berikut.

$$
\frac{V_1}{T_1} = \frac{V_2}{T_2}
$$

Suhu $T$ harus dinyatakan dalam kelvin, dengan $T = t + 273$ dan $t$ dalam Celsius. Sebagai contoh, udara pada 27 °C berada pada 300 K, dan pada 77 °C berada pada 350 K. Jika tekanannya tetap, volume udara menjadi:

$$
\frac{V_2}{V_1} = \frac{350}{300} \approx 1{,}17
$$

Artinya, volume udara naik sekitar 17 %. Pertambahan volume inilah yang membuat udara di dalam balon menjadi lebih ringan.

## Ringkasan

- Termometer memanfaatkan pemuaian cairan dan kesetimbangan suhu.
- Bimetal melengkung karena dua logam memiliki koefisien muai yang berbeda.
- Balon udara terbang karena udara panas memuai dan menjadi lebih ringan.

<details>
<summary>Pertanyaan pemikiran: mengapa jalan beton diberi celah?</summary>

Beton dan aspal juga memuai ketika siang hari panas. Tanpa celah pemuaian, tekanan dari pertambahan panjang dapat membuat jalan retak atau melengkung. Celah itu memberi ruang bagi pertambahan panjang.

</details>

Pada proyek **Balon Udara Sederhana**, kamu akan membuat balon dari kertas tipis dan menguji apakah balon itu dapat terbang.
