  <style>
:root {
  /* Colour */
  --bg: #0a0a1a;          /* page background; also the 3D canvas background */
  --surface: #14141e;     /* panels, cards, step rows */
  --panel: rgba(20, 20, 30, 0.9);
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: #333;
  --text: #ffffff;
  --text-muted: #aaa;
  --text-dim: #888;
  --accent: #6366f1;      /* primary action, slider thumb, active state */
  --accent-hover: #5558e8;
  --accent-soft: rgba(139, 92, 246, 0.95);  /* tooltips, transient overlays */
  --success: #fbbf24;     /* completion, headings, callouts */
  --warning: #fb923c;
  --error: #ff6b6b;
  --accent-text: #ffffff;  /* text/icon colour sitting on --accent fills */
  --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-none: none;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* Type scale (system fonts only) */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --text-sm: 14px;
  --text-xs: 13px;
  --text-caption: 11px;   /* uppercase control labels */
  --text-heading: 24px;
  --font-weight-display: 600;  /* headings */
  --font-weight-number: 500;   /* monospaced readouts */

  /* Focus, motion, stacking */
  --focus-ring: 0 0 0 3px rgba(99, 102, 241, 0.5);
  --motion: 0.2s;
  --motion-slow: 0.3s;
  --z-overlay: 100;        /* panels, tooltips */
  --z-modal: 1000;         /* loading screens, modal dialogs */
}

[data-theme="light"] {
  --bg: #f7f7fb;
  --surface: #ffffff;
  --panel: rgba(255, 255, 255, 0.92);
  --border: rgba(0, 0, 0, 0.12);
  --border-strong: #d4d4d8;
  --text: #16161d;
  --text-muted: #52525b;
  --text-dim: #71717a;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79, 70, 229, 0.95);
  --success: #b45309;
  --warning: #c2410c;
  --error: #dc2626;
  --accent-text: #ffffff;
  --shadow-soft: 0 4px 16px rgba(15, 15, 35, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
}

h1, h2, h3 { font-weight: var(--font-weight-display); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: var(--space-4);
}
.panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

.btn {
  font-family: inherit;
  font-size: var(--text-sm);
  min-height: 44px;            /* never below 44px, mobile */
  min-width: 44px;
  padding: var(--space-3) var(--space-5);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--border-strong);
  color: var(--text);
  box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
  cursor: pointer;
  transition: background var(--motion);
}
.btn:hover { background: var(--text-muted); }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { background: transparent; border-color: var(--border); }
.btn-ghost:hover { background: var(--surface); }

.control-label {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

input[type="range"] {
  width: 100%; height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* Visually hidden but announced by screen readers. Use when a layout has no
   room for a visible <h1> (e.g. a full-bleed canvas) — never as an excuse to
   drop a heading. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

#feedback-panel {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}
#feedback-panel.success { border-left-color: var(--success); }
#feedback-panel.error { border-left-color: var(--error); }

.progress-track {
  height: 8px;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.mono-value { font-family: var(--font-mono); font-weight: var(--font-weight-number); }

.sources {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
}
.sources-heading {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.source-item { font-size: var(--text-xs); color: var(--text-dim); margin-bottom: var(--space-1); }
.source-item a { color: var(--accent); text-decoration: none; }
.source-item a:hover { color: var(--accent-hover); text-decoration: underline; }

.reading-article {
  max-width: 720px;
  margin: 0 auto;
  line-height: 1.7;
}
.reading-article h2 { margin-top: var(--space-6); margin-bottom: var(--space-3); }
.reading-article h3 { margin-top: var(--space-5); margin-bottom: var(--space-2); }
.reading-article p, .reading-article ul, .reading-article ol, .reading-article table { margin-bottom: var(--space-4); }
.reading-article ul, .reading-article ol { padding-left: var(--space-5); }
.reading-article blockquote {
  border-left: 3px solid var(--border-strong);
  padding-left: var(--space-4);
  color: var(--text-muted);
  margin-bottom: var(--space-4);
}
.reading-article img { max-width: 100%; border-radius: var(--radius-md); }
.reading-article code { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface); padding: 2px 6px; border-radius: var(--radius-sm); }
.reading-article pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
  margin-bottom: var(--space-4);
}
.reading-article pre code { background: none; padding: 0; }
.reading-article table { width: 100%; border-collapse: collapse; }
.reading-article th, .reading-article td { border: 1px solid var(--border); padding: var(--space-2) var(--space-3); text-align: left; }
.reading-article details {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
}
.reading-article summary {
  cursor: pointer;
  font-weight: var(--font-weight-display);
  color: var(--text);
}
.reading-article details[open] summary { margin-bottom: var(--space-2); }
.glossary-term {
  text-decoration: underline dotted var(--text-dim);
  text-decoration-thickness: 1px;
  cursor: help;
}
.katex-display { margin: var(--space-4) 0; overflow-x: auto; }

/* highlight.js token colours — mapped to the token set, not a canned theme */
.hljs { color: var(--text); }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: var(--accent); }
.hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-variable, .hljs-template-tag, .hljs-template-variable { color: var(--success); }
.hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: var(--text-dim); }
.hljs-number { color: var(--warning); }

## Apa Itu Ilmu Pengetahuan Alam?

Ilmu Pengetahuan Alam (IPA), atau sains, adalah ilmu yang mempelajari alam semesta dan segala gejalanya. Para ilmuwan memperoleh pengetahuan ini dengan cara **mengamati**, **mengukur**, dan **menguji** dugaan melalui percobaan. Karena luasnya alam, IPA dibagi menjadi beberapa cabang. Masing-masing cabang memiliki **objek kajian** (hal yang dipelajari) dan cara pandang yang berbeda.

Di kelas VII, kamu akan mengenal enam cabang utama berikut.

| Cabang | Objek kajian utama | Contoh di sekitar kita |
| --- | --- | --- |
| Biologi | Makhluk hidup | Daun hijau yang membuat makanan dari sinar Matahari |
| Fisika | Materi, energi, dan gerak | Bola yang melambung lalu jatuh kembali |
| Kimia | Susunan dan perubahan zat | Besi yang berkarat di pagar rumah |
| Geologi | Bumi dan batuannya | Letusan Gunung Merapi di Jawa Tengah |
| Astronomi | Benda-benda langit | Gerhana Bulan yang terlihat dari Indonesia |
| Ekologi | Hubungan makhluk hidup dengan lingkungannya | Hutan mangrove yang melindungi pantai |

## Biologi: Ilmu tentang Kehidupan

<span class="glossary-term" title="Biologi berasal dari kata bio (hidup) dan logos (ilmu). Jadi, biologi berarti ilmu tentang makhluk hidup.">Biologi</span> berasal dari kata *bios* (hidup) dan *logos* (ilmu). Cabang ini mempelajari tumbuhan, hewan, manusia, dan mikroorganisme, mulai dari struktur sel hingga cara makhluk hidup berkembang biak.

Contohnya, ketika kamu sakit perut karena makanan yang tidak bersih, penyebabnya bisa berupa bakteri tertentu. Ilmu biologi membantu kita memahami bagaimana bakteri itu hidup dan bagaimana tubuh melawannya.

## Fisika: Ilmu tentang Materi dan Energi

<span class="glossary-term" title="Energi adalah kemampuan untuk melakukan usaha atau menyebabkan perubahan. Satuan SI energi adalah joule (J).">Energi</span> dan gerak adalah pusat perhatian fisika. Cabang ini menjelaskan gaya, gerak, cahaya, bunyi, listrik, dan panas.

Saat kamu mengayuh sepeda, otot kakimu mengubah energi kimia dari makanan menjadi energi gerak. Fisika menjelaskan mengapa sepeda bisa melaju dan mengapa ia berhenti jika tidak dikayuh lagi.

## Kimia: Ilmu tentang Zat dan Perubahannya

<span class="glossary-term" title="Zat adalah segala sesuatu yang memiliki massa dan menempati ruang.">Zat</span> menjadi objek utama kimia. Kimia mempelajari susunan, sifat, dan perubahan zat. Misalnya, garam dapur, air, dan gas oksigen memiliki sifat yang berbeda karena susunan partikelnya berbeda.

Memasak telur hingga matang adalah contoh perubahan kimia, karena putih telur berubah menjadi zat baru yang tidak dapat kembali seperti semula. Besi yang berkarat juga mengalami perubahan kimia.

## Geologi: Ilmu tentang Bumi

Geologi mempelajari bumi, terutama batuan, mineral, lapisan bumi, gunung api, dan gempa bumi. Dengan memahami geologi, kita dapat mengetahui bagaimana pegunungan terbentuk dan mengapa beberapa daerah di Indonesia sering mengalami gempa.

Indonesia berada di pertemuan beberapa lempeng bumi, sehingga banyak gunung api aktif seperti Merapi. Pengetahuan geologi membantu pemerintah dan masyarakat bersiap menghadapi bencana.

## Astronomi: Ilmu tentang Benda Langit

Astronomi mempelajari benda-benda di luar Bumi, seperti Matahari, Bulan, planet, bintang, dan galaksi. Ilmuwan astronomi juga meneliti pergerakan benda langit serta fenomena seperti gerhana.

Saat gerhana Bulan, Bulan tampak berwarna kemerahan karena cahaya Matahari yang sampai ke Bulan telah dibiaskan oleh atmosfer Bumi. Ini adalah contoh penerapan fisika dalam astronomi.

## Ekologi: Hubungan Makhluk Hidup dan Lingkungannya

<span class="glossary-term" title="Ekosistem adalah sistem yang terdiri atas makhluk hidup dan lingkungan tak hidupnya yang saling memengaruhi.">Ekosistem</span> adalah tempat makhluk hidup dan lingkungannya saling berinteraksi. Ekologi mempelajari hubungan itu, misalnya rantai makanan, persaingan antarmakhluk hidup, dan keseimbangan alam.

Ekologi sangat erat dengan biologi, tetapi dalam kurikulum ia dipelajari sebagai cabang tersendiri karena fokusnya pada hubungan makhluk hidup dengan lingkungannya. Hutan mangrove di pesisir Indonesia adalah contoh ekosistem yang menjadi tempat ikan dan kepiting berkembang biak, sekaligus menahan abrasi pantai.

## Menghubungkan Cabang-cabang IPA

Cabang-cabang IPA tidak berdiri sendiri. Dalam satu peristiwa, kita dapat menggunakan beberapa cabang sekaligus. Contohnya, untuk memahami hujan abu dari gunung api, kita memerlukan geologi (asal abu vulkanik), fisika (cara abu terbawa angin), dan biologi (dampaknya bagi tanaman).
