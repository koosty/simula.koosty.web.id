  <style>
:root {
  /* Colour */
  --bg: #0a0a1a;          /* page background; also the 3D canvas background */
  --surface: #14141e;     /* panels, cards, step rows */
  --panel: rgba(20, 20, 30, 0.9);
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: #333;
  --text: #ffffff;
  --text-muted: #aaa;
  --text-dim: #888;
  --accent: #6366f1;      /* primary action, slider thumb, active state */
  --accent-hover: #5558e8;
  --accent-soft: rgba(139, 92, 246, 0.95);  /* tooltips, transient overlays */
  --success: #fbbf24;     /* completion, headings, callouts */
  --warning: #fb923c;
  --error: #ff6b6b;
  --accent-text: #ffffff;  /* text/icon colour sitting on --accent fills */
  --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-none: none;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* Type scale (system fonts only) */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --text-sm: 14px;
  --text-xs: 13px;
  --text-caption: 11px;   /* uppercase control labels */
  --text-heading: 24px;
  --font-weight-display: 600;  /* headings */
  --font-weight-number: 500;   /* monospaced readouts */

  /* Focus, motion, stacking */
  --focus-ring: 0 0 0 3px rgba(99, 102, 241, 0.5);
  --motion: 0.2s;
  --motion-slow: 0.3s;
  --z-overlay: 100;        /* panels, tooltips */
  --z-modal: 1000;         /* loading screens, modal dialogs */
}

[data-theme="light"] {
  --bg: #f7f7fb;
  --surface: #ffffff;
  --panel: rgba(255, 255, 255, 0.92);
  --border: rgba(0, 0, 0, 0.12);
  --border-strong: #d4d4d8;
  --text: #16161d;
  --text-muted: #52525b;
  --text-dim: #71717a;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79, 70, 229, 0.95);
  --success: #b45309;
  --warning: #c2410c;
  --error: #dc2626;
  --accent-text: #ffffff;
  --shadow-soft: 0 4px 16px rgba(15, 15, 35, 0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
}

h1, h2, h3 { font-weight: var(--font-weight-display); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: var(--space-4);
}
.panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

.btn {
  font-family: inherit;
  font-size: var(--text-sm);
  min-height: 44px;            /* never below 44px, mobile */
  min-width: 44px;
  padding: var(--space-3) var(--space-5);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--border-strong);
  color: var(--text);
  box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
  cursor: pointer;
  transition: background var(--motion);
}
.btn:hover { background: var(--text-muted); }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { background: transparent; border-color: var(--border); }
.btn-ghost:hover { background: var(--surface); }

.control-label {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

input[type="range"] {
  width: 100%; height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* Visually hidden but announced by screen readers. Use when a layout has no
   room for a visible h1 element (e.g. a full-bleed canvas) — never as an excuse to
   drop a heading. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

#feedback-panel {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}
#feedback-panel.success { border-left-color: var(--success); }
#feedback-panel.error { border-left-color: var(--error); }

.progress-track {
  height: 8px;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.mono-value { font-family: var(--font-mono); font-weight: var(--font-weight-number); }

.sources {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
}
.sources-heading {
  font-size: var(--text-caption);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.source-item { font-size: var(--text-xs); color: var(--text-dim); margin-bottom: var(--space-1); }
.source-item a { color: var(--accent); text-decoration: none; }
.source-item a:hover { color: var(--accent-hover); text-decoration: underline; }

.reading-article {
  max-width: 720px;
  margin: 0 auto;
  line-height: 1.7;
}
.reading-article h2 { margin-top: var(--space-6); margin-bottom: var(--space-3); }
.reading-article h3 { margin-top: var(--space-5); margin-bottom: var(--space-2); }
.reading-article p, .reading-article ul, .reading-article ol, .reading-article table { margin-bottom: var(--space-4); }
.reading-article ul, .reading-article ol { padding-left: var(--space-5); }
.reading-article blockquote {
  border-left: 3px solid var(--border-strong);
  padding-left: var(--space-4);
  color: var(--text-muted);
  margin-bottom: var(--space-4);
}
.reading-article img { max-width: 100%; border-radius: var(--radius-md); }
.reading-article code { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface); padding: 2px 6px; border-radius: var(--radius-sm); }
.reading-article pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
  margin-bottom: var(--space-4);
}
.reading-article pre code { background: none; padding: 0; }
.reading-article table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
.reading-article th, .reading-article td { border: 1px solid var(--border); padding: var(--space-2) var(--space-3); text-align: left; }
.reading-article details {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
}
.reading-article summary {
  cursor: pointer;
  font-weight: var(--font-weight-display);
  color: var(--text);
}
.reading-article details[open] summary { margin-bottom: var(--space-2); }
.glossary-term {
  text-decoration: underline dotted var(--text-dim);
  text-decoration-thickness: 1px;
  cursor: help;
}
.katex-display { margin: var(--space-4) 0; overflow-x: auto; }

/* highlight.js token colours — mapped to the token set, not a canned theme */
.hljs { color: var(--text); }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: var(--accent); }
.hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-variable, .hljs-template-tag, .hljs-template-variable { color: var(--success); }
.hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: var(--text-dim); }
.hljs-number { color: var(--warning); }

  <script type="text/markdown" id="reading-source">## Apa itu makhluk hidup?

Di sekitar kita ada banyak benda. Kucing, pohon mangga, dan bakteri di dalam usus termasuk benda hidup. Batu, air, dan kursi termasuk benda tak hidup. Bagaimana cara membedakannya? Para ilmuwan tidak hanya melihat apakah suatu benda bergerak. Mereka memeriksa apakah benda itu memiliki sejumlah ciri yang dimiliki semua makhluk hidup.

Makhluk hidup dikenali dari delapan karakteristik berikut. Umumnya, makhluk hidup memiliki semua karakteristik ini. Benda tak hidup tidak memilikinya.

## Delapan karakteristik makhluk hidup

### 1. Bergerak

Makhluk hidup dapat berpindah tempat atau menggerakkan bagian tubuhnya. Hewan berpindah dengan berjalan, berlari, atau berenang. Tumbuhan juga bergerak, misalnya daun bunga matahari yang selalu mengarah ke cahaya. Geraknya memang lambat dan tidak mudah terlihat.

### 2. Tumbuh dan berkembang

Makhluk hidup bertambah ukuran dan jumlah <span class="glossary-term" title="Unit terkecil penyusun makhluk hidup yang dapat menjalankan fungsi kehidupan.">sel</span> penyusunnya. Pertumbuhan adalah bertambahnya ukuran tubuh. Perkembangan adalah perubahan menuju bentuk atau kemampuan yang lebih lengkap. Contohnya, ulat berkembang menjadi kupu-kupu.

### 3. Bereproduksi

Makhluk hidup menghasilkan keturunan agar jenisnya tetap ada. Proses ini disebut <span class="glossary-term" title="Perkembangbiakan makhluk hidup untuk menghasilkan keturunan.">reproduksi</span>. Reproduksi dapat terjadi dengan dua individu, seperti pada hewan yang kawin, atau dengan satu induk saja, seperti tunas anakan pada pisang.

### 4. Menanggapi rangsangan

Makhluk hidup menanggapi perubahan di lingkungannya. Perubahan itu disebut <span class="glossary-term" title="Perubahan di lingkungan yang ditanggapi makhluk hidup, misalnya cahaya, suhu, sentuhan, atau bunyi.">rangsangan</span>. Kita menarik tangan saat menyentuh benda panas. Daun putri malu menutup saat disentuh.

### 5. Menggunakan energi

Makhluk hidup memerlukan energi untuk bergerak, tumbuh, dan menjalankan proses hidup lainnya. Tumbuhan memperoleh energi dari cahaya matahari melalui fotosintesis. Hewan memperolehnya dari makanan. Seluruh reaksi kimia di dalam tubuh makhluk hidup disebut <span class="glossary-term" title="Seluruh reaksi kimia di dalam makhluk hidup untuk mengolah zat dan energi.">metabolisme</span>.

### 6. Bernapas

Bernapas berarti menghirup dan mengembuskan udara. Proses ini membawa oksigen masuk ke tubuh dan mengeluarkan karbon dioksida. Di dalam sel, oksigen digunakan untuk respirasi sel. Respirasi sel adalah proses kimia yang menghasilkan energi. Jadi, bernapas dan respirasi sel adalah dua hal yang berbeda, tetapi saling berkaitan.

### 7. Ekskresi

Ekskresi adalah pengeluaran zat sisa metabolisme yang tidak lagi dibutuhkan tubuh. Pada manusia, urine dan keringat termasuk hasil ekskresi. Pada tumbuhan, zat sisa dapat dikeluarkan melalui daun yang gugur.

### 8. Tersusun dari sel

Semua makhluk hidup tersusun atas satu atau lebih sel. Bakteri hanya terdiri dari satu sel. Tubuh manusia tersusun dari puluhan triliun sel. Sel adalah unit terkecil yang mampu menjalankan fungsi kehidupan.

| Bereproduksi | Ayam bertelur | Tumbuhan menghasilkan biji |

## Mengapa virus bukan makhluk hidup?

Virus memiliki materi genetik dan dapat memperbanyak diri, sehingga sekilas tampak seperti makhluk hidup. Namun, virus tidak memenuhi beberapa karakteristik utama:

- **Tidak tersusun dari sel.** Virus hanya berisi materi genetik yang dibungkus selubung protein.
- **Tidak dapat bereproduksi sendiri.** Virus harus masuk ke dalam sel <span class="glossary-term" title="Sel atau makhluk yang ditumpangi virus untuk memperbanyak diri.">inang</span> agar dapat memperbanyak diri.
- **Tidak melakukan metabolisme sendiri.** Virus tidak mengolah energi di luar sel inangnya.

Karena tidak memenuhi ciri-ciri tersebut, sebagian besar ilmuwan tidak menggolongkan virus sebagai makhluk hidup.

<details>
<summary>Ingin tahu lebih jauh?</summary>

Beberapa virus dapat dikristalkan seperti benda mati. Kristal itu dapat disimpan lama. Ketika masuk ke dalam sel inang yang sesuai, virus dapat kembali aktif dan memperbanyak diri.

</details>

## Ringkasan

- Makhluk hidup memiliki delapan karakteristik: bergerak, tumbuh dan berkembang, bereproduksi, menanggapi rangsangan, menggunakan energi, bernapas, ekskresi, dan tersusun dari sel.
- Benda yang bergerak belum tentu makhluk hidup. Yang penting adalah ciri-ciri tadi dimiliki bersama-sama.
- Virus tidak tersusun dari sel dan tidak dapat bereproduksi tanpa sel inang, sehingga tidak tergolong makhluk hidup.
