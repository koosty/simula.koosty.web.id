    :root {
      /* Colour */
      --bg: #12131d;          /* page background; also the 3D canvas background */
      --surface: #1a1b25;     /* panels, cards, step rows */
      --panel: rgba(18, 19, 36, 0.92);
      --border: rgba(138, 43, 226, 0.4);
      --border-strong: #8a2be2;
      --text: #e2e1f0;
      --text-muted: #b9cacb;
      --text-dim: #849495;
      --accent: #00f0ff;      /* primary action, slider thumb, active state */
      --accent-hover: #7df4ff;
      --accent-soft: rgba(138, 43, 226, 0.95);  /* tooltips, transient overlays */
      --success: #39ff14;     /* completion, headings, callouts */
      --warning: #ffe600;
      --error: #ff4a8d;
      --accent-text: #0b0c16;  /* text/icon colour sitting on --accent fills */
      --shadow-soft: 0 0 12px rgba(138, 43, 226, 0.25);
      --shadow-none: none;

      /* Spacing scale */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      /* Radius scale */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-pill: 999px;

      /* Type scale (system fonts only) */
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --text-base: 16px;
      --text-sm: 14px;
      --text-xs: 13px;
      --text-caption: 11px;   /* uppercase control labels */
      --text-heading: 24px;
      --font-weight-display: 600;  /* headings */
      --font-weight-number: 500;   /* monospaced readouts */

      /* Focus, motion, stacking */
      --focus-ring: 0 0 0 3px rgba(0, 240, 255, 0.5);
      --motion: 0.2s;
      --motion-slow: 0.3s;
      --z-overlay: 100;        /* panels, tooltips */
      --z-modal: 1000;         /* loading screens, modal dialogs */
    }

    h1, h2, h3 { font-family: var(--font-display); }


    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      font-size: var(--text-base);
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }

    h1, h2, h3 { font-weight: var(--font-weight-display); }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: var(--space-4);
    }
    .panel-heading { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }

    .btn {
      font-family: inherit;
      font-size: var(--text-sm);
      min-height: 44px;            /* never below 44px, mobile */
      min-width: 44px;
      padding: var(--space-3) var(--space-5);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--border-strong);
      color: var(--text);
      box-shadow: var(--shadow-none);  /* buttons stay flat; only .panel lifts */
      cursor: pointer;
      transition: background var(--motion);
    }
    .btn:hover { background: var(--text-muted); }
    .btn:active { transform: scale(0.95); }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-ghost { background: transparent; border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface); }

    .control-label {
      font-size: var(--text-caption);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%; height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border-strong);
      border-radius: var(--radius-pill);
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    /* Visually hidden but announced by screen readers. Use when a layout has no
       room for a visible <h1> (e.g. a full-bleed canvas) — never as an excuse to
       drop a heading. */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    #feedback-panel {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
    }
    #feedback-panel.success { border-left-color: var(--success); }
    #feedback-panel.error { border-left-color: var(--error); }

    .progress-track {
      height: 8px;
      background: var(--border-strong);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .mono-value { font-family: var(--font-mono); font-weight: var(--font-weight-number); }

      color: var(--text-muted);

    .source-item { font-size: var(--text-xs); color: var(--text-dim); margin-bottom: var(--space-1); }

    .source-item a:hover { color: var(--accent-hover); text-decoration: underline; }

    .reading-article {
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.7;
    }
    .reading-article h2 { margin-top: var(--space-6); margin-bottom: var(--space-3); }
    .reading-article h3 { margin-top: var(--space-5); margin-bottom: var(--space-2); }
    .reading-article p, .reading-article ul, .reading-article ol, .reading-article table { margin-bottom: var(--space-4); }
    .reading-article ul, .reading-article ol { padding-left: var(--space-5); }
    .reading-article blockquote {
      border-left: 3px solid var(--border-strong);
      padding-left: var(--space-4);
      color: var(--text-muted);
      margin-bottom: var(--space-4);
    }
    .reading-article img { max-width: 100%; border-radius: var(--radius-md); }
    .reading-article code { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface); padding: 2px 6px; border-radius: var(--radius-sm); }
    .reading-article pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      overflow-x: auto;
      margin-bottom: var(--space-4);
    }
    .reading-article pre code { background: none; padding: 0; }
    .reading-article table { width: 100%; border-collapse: collapse; }
    .reading-article th, .reading-article td { border: 1px solid var(--border); padding: var(--space-2) var(--space-3); text-align: left; }
    .reading-article details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
    }
    .reading-article summary {
      cursor: pointer;
      font-weight: var(--font-weight-display);
      color: var(--text);
    }
    .reading-article details[open] summary { margin-bottom: var(--space-2); }
    .glossary-term {
      text-decoration: underline dotted var(--text-dim);
      text-decoration-thickness: 1px;
      cursor: help;
    }
    .katex-display { margin: var(--space-4) 0; overflow-x: auto; }

    /* highlight.js token colours — mapped to the token set, not a canned theme */
    .hljs { color: var(--text); }
    .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: var(--accent); }
    .hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-variable, .hljs-template-tag, .hljs-template-variable { color: var(--success); }
    .hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: var(--text-dim); }
    .hljs-number { color: var(--warning); }

    /* ---- Scene layout (composition only; tokens and components above) ---- */
    .app { max-width: 960px; margin: 0 auto; padding: var(--space-4); display: grid; gap: var(--space-4); }
    .app h1 { font-size: var(--text-heading); margin-bottom: var(--space-2); }
    .layout { display: grid; gap: var(--space-4); }
    @media (min-width: 720px) {
      .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
    .toolbar .mono-value { font-size: var(--text-sm); margin: 0 var(--space-2); }
    #diagram { width: 100%; height: auto; max-height: 60vh; display: block; }
    .node { cursor: pointer; transition: opacity var(--motion-slow); }
    .node-body { transition: transform var(--motion); }
    .node:hover .node-body { transform: translateY(-4px); }
    .node:active .node-body { transform: scale(0.98); }
    .node:focus { outline: none; }
    .node:focus-visible .node-body rect { stroke: var(--accent); stroke-width: 3; }
    .node.is-current .node-body rect { stroke: var(--accent); stroke-width: 3; }
    .node.is-hidden, .edge.is-hidden { opacity: 0; pointer-events: none; }
    .edge { transition: opacity var(--motion-slow); }
    #detail-panel h2 { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }
    #detail-title { font-size: var(--text-heading); margin-bottom: var(--space-2); }
    #detail-text { margin-bottom: var(--space-3); }
    #detail-link { font-size: var(--text-sm); color: var(--text-muted); }
    #detail-step { margin-bottom: var(--space-2); }
  </style>

<body>
  <main class="app">
    <header class="panel">
      <p class="control-label">Diagram · IPA Kelas VII</p>
      <h1>Tingkatan Organisasi Kehidupan</h1>
      <p>Susun tingkatan organisasi kehidupan dari yang paling kecil hingga yang paling besar. Tekan langkah berikutnya untuk membuka setiap tingkatan, lalu klik kotak untuk membaca penjelasannya.</p>

    <div class="layout">
      <section class="panel" aria-labelledby="diagram-heading">
        <h2 id="diagram-heading" class="panel-heading">Hierarki kehidupan</h2>
        <div class="toolbar">
          <button id="prev-btn" class="btn" type="button">Langkah sebelumnya</button>
          <span id="reveal-status" class="mono-value"></span>
          <button id="next-btn" class="btn btn-primary" type="button">Langkah berikutnya</button>
          <button id="reset-btn" class="btn btn-ghost" type="button">Mulai ulang</button>
        </div>
        <svg id="diagram" role="img" aria-labelledby="diagram-title">
          <title id="diagram-title">Diagram tingkatan organisasi kehidupan dari individu hingga biosfer</title>
        </svg>
      </section>

      <aside id="detail-panel" class="panel" aria-live="polite" aria-labelledby="detail-title">
        <h2 id="detail-step"></h2>
        <h3 id="detail-title"></h3>
        <p id="detail-text"></p>
        <p id="detail-link"></p>
      </aside>
    </div>
  </main>

{"type":"diagram","diagramType":"hierarchy","description":"Tingkatan organisasi kehidupan dari individu hingga biosfer.","viewBox":[360,760],"nodes":[{"id":"n1","label":"Individu","x":180,"y":70,"details":"Satu makhluk hidup yang utuh, misalnya seekor kucing atau sebatang pohon mangga."},{"id":"n2","label":"Populasi","x":180,"y":195,"details":"Kumpulan individu sejenis yang hidup di tempat dan waktu yang sama, misalnya seluruh kucing di satu kampung."},{"id":"n3","label":"Komunitas","x":180,"y":320,"details":"Kumpulan berbagai populasi yang hidup bersama di satu wilayah, misalnya kucing, tikus, dan burung di sebuah kebun."},{"id":"n4","label":"Ekosistem","x":180,"y":445,"details":"Komunitas bersama lingkungan abiotiknya yang saling memengaruhi, misalnya sungai beserta ikan, tumbuhan air, air, dan batuannya."},{"id":"n5","label":"Bioma","x":180,"y":570,"details":"Kumpulan ekosistem dengan iklim dan vegetasi yang khas, misalnya hutan hujan tropis atau padang rumput savana."},{"id":"n6","label":"Biosfer","x":180,"y":695,"details":"Seluruh bagian Bumi tempat makhluk hidup ditemukan, mulai dari dasar laut hingga lapisan atmosfer bawah."}],"edges":[{"from":"n1","to":"n2","label":"Individu sejenis berkumpul membentuk populasi"},{"from":"n2","to":"n3","label":"Berbagai populasi hidup bersama di satu wilayah"},{"from":"n3","to":"n4","label":"Komunitas berinteraksi dengan lingkungan abiotiknya"},{"from":"n4","to":"n5","label":"Ekosistem dengan iklim dan vegetasi yang sama membentuk bioma"},{"from":"n5","to":"n6","label":"Seluruh bioma membentuk biosfer"}],"revealOrder":["n1","n2","n3","n4","n5","n6"]}
  </script>

  <script>
    (function () {
      'use strict';

      var CONFIG = JSON.parse(document.getElementById('widget-config').textContent);
      var NODE_WIDTH = 200;
      var NODE_HEIGHT = 64;
      var ARROW_OFFSET = 10;
      var SVG_NS = 'http://www.w3.org/2000/svg';

      var svg = document.getElementById('diagram');
      var prevBtn = document.getElementById('prev-btn');
      var nextBtn = document.getElementById('next-btn');
      var resetBtn = document.getElementById('reset-btn');

      var nodesById = {};
      CONFIG.nodes.forEach(function (n) { nodesById[n.id] = n; });
      var order = CONFIG.revealOrder;

      var shown = 1;
      var selected = order[0];
      var nodeEls = {};
      var edgeEls = [];

      function setText(id, text) {
        var node = document.getElementById(id);
        if (node) node.textContent = text;
      }

      function svgEl(name, attrs, parent) {
        var node = document.createElementNS(SVG_NS, name);
        Object.keys(attrs).forEach(function (key) { node.setAttribute(key, attrs[key]); });
        if (parent) parent.appendChild(node);
        return node;
      }

      function getEdgePoints(from, to) {
        var dx = to.x - from.x;
        var dy = to.y - from.y;
        var sx, sy, ex, ey;
        if (Math.abs(dy) > Math.abs(dx)) {
          sx = from.x;
          sy = dy > 0 ? from.y + NODE_HEIGHT / 2 : from.y - NODE_HEIGHT / 2;
          ex = to.x;
          ey = dy > 0 ? to.y - NODE_HEIGHT / 2 - ARROW_OFFSET : to.y + NODE_HEIGHT / 2 + ARROW_OFFSET;
        } else {
          sx = dx > 0 ? from.x + NODE_WIDTH / 2 : from.x - NODE_WIDTH / 2;
          sy = from.y;
          ex = dx > 0 ? to.x - NODE_WIDTH / 2 - ARROW_OFFSET : to.x + NODE_WIDTH / 2 + ARROW_OFFSET;
          ey = to.y;
        }
        return 'M ' + sx + ' ' + sy + ' L ' + ex + ' ' + ey;
      }

      function isRevealed(id) {
        var index = order.indexOf(id);
        return index !== -1 && index < shown;
      }

      function build() {
        svg.setAttribute('viewBox', CONFIG.viewBox.join(' '));
        var title = svg.querySelector('title');
        svg.textContent = '';
        if (title) svg.appendChild(title);

        var defs = svgEl('defs', {}, svg);
        var marker = svgEl('marker', {
          id: 'arrow', viewBox: '0 0 10 10', refX: '9', refY: '5',
          markerWidth: '8', markerHeight: '8', orient: 'auto-start-reverse'
        }, defs);
        svgEl('path', { d: 'M0,0 L10,5 L0,10 z', style: 'fill: var(--text-muted)' }, marker);

        CONFIG.edges.forEach(function (edge) {
          var g = svgEl('g', { id: 'edge-' + edge.from + '-' + edge.to, class: 'edge' }, svg);
          svgEl('path', {
            d: getEdgePoints(nodesById[edge.from], nodesById[edge.to]),
            'marker-end': 'url(#arrow)',
            style: 'stroke: var(--text-dim); stroke-width: 2; fill: none'
          }, g);
          edgeEls.push({ g: g, from: edge.from, to: edge.to });
        });

        CONFIG.nodes.forEach(function (n) {
          var g = svgEl('g', {
            id: 'node-' + n.id, class: 'node',
            transform: 'translate(' + n.x + ', ' + n.y + ')',
            tabindex: '0', role: 'button'
          }, svg);
          var body = svgEl('g', { class: 'node-body' }, g);
          svgEl('rect', {
            x: -NODE_WIDTH / 2, y: -NODE_HEIGHT / 2, width: NODE_WIDTH, height: NODE_HEIGHT, rx: 12,
            style: 'fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5'
          }, body);
          var label = svgEl('text', {
            'text-anchor': 'middle', 'dominant-baseline': 'middle',
            style: 'fill: var(--text); font-size: var(--text-base); font-weight: var(--font-weight-display)'
          }, body);
          label.textContent = n.label;
          g.addEventListener('click', function () { select(n.id); });
          g.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(n.id); }
          });
          nodeEls[n.id] = g;
        });
      }

      function renderDetail() {
        var n = nodesById[selected];
        if (!n) return;
        setText('detail-step', 'Tingkat ' + (order.indexOf(selected) + 1) + ' dari ' + order.length);
        setText('detail-title', n.label);
        setText('detail-text', n.details);
        var incoming = CONFIG.edges.filter(function (e) { return e.to === selected && isRevealed(e.from); });
        setText('detail-link', incoming.length
          ? 'Hubungan dengan tingkat sebelumnya: ' + incoming[0].label + '.'
          : 'Tingkat paling dasar dalam hierarki.');
      }

      function render() {
        order.forEach(function (id, index) {
          var g = nodeEls[id];
          if (!g) return;
          g.classList.toggle('is-hidden', index >= shown);
          g.classList.toggle('is-current', id === selected);
        });
        edgeEls.forEach(function (item) {
          item.g.classList.toggle('is-hidden', !(isRevealed(item.from) && isRevealed(item.to)));
        });
        setText('reveal-status', shown + ' / ' + order.length);
        if (prevBtn) prevBtn.disabled = shown <= 1;
        if (nextBtn) nextBtn.disabled = shown >= order.length;
        renderDetail();
      }

      function select(id) {
        if (!isRevealed(id)) return;
        selected = id;
        render();
      }

      function next() {
        if (shown >= order.length) return;
        shown += 1;
        selected = order[shown - 1];
        render();
      }

      function prev() {
        if (shown <= 1) return;
        shown -= 1;
        selected = order[shown - 1];
        render();
      }

      function resetState() {
        shown = 1;
        selected = order[0];
        render();
      }

      function init() {
        build();
        if (prevBtn) prevBtn.addEventListener('click', prev);
        if (nextBtn) nextBtn.addEventListener('click', next);
        if (resetBtn) resetBtn.addEventListener('click', resetState);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
          else if (e.key === 'r' || e.key === 'R') resetState();
        });
        render();
      }

      init();
    })();
  </script>
</body>
</html>
